name: Create Release

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.server_url == 'https://git.futuregadgetlabs.net' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != 'dev' &&
      github.event.workflow_run.head_branch != 'master'
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: IDHANServer-linux-x86_64
          path: release/linux

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: build-windows.yml
          commit: ${{ github.event.workflow_run.head_sha }}
          name: IDHANServer-windows-x86_64
          path: release/windows
          workflow_conclusion: success
          wait_timeout: 10

      - name: Compress artifacts
        run: |
          cd release/linux && tar czf ../IDHANServer-linux-x86_64.tar.gz .
          cd ../windows && zip -r ../IDHANServer-windows-x86_64.zip .

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          name: IDHAN ${{ github.event.workflow_run.head_branch }}
          draft: false
          prerelease: false
          files: |
            release/IDHANServer-linux-x86_64.tar.gz
            release/IDHANServer-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

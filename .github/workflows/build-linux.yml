name: Build Linux Native Binary

on:
  push:
    branches: [dev, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: idhan:extract
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract artifacts from image
        run: |
          docker create --name extract idhan:extract
          mkdir -p artifacts
          docker cp extract:/usr/bin/IDHANServer artifacts/IDHANServer
          docker cp extract:/usr/share/idhan/modules artifacts/modules
          docker cp extract:/usr/share/idhan/mime artifacts/mime
          docker cp extract:/usr/share/idhan/static artifacts/static
          docker cp extract:/usr/share/idhan/config.toml artifacts/config.toml
          docker rm extract

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDHANServer-linux-x86_64
          path: artifacts/

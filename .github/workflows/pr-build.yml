name: PR Build Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - master
      - dev

env:
  REGISTRY: git.futuregadgetlabs.net
  IMAGE_NAME: kj16609/idhan

# Only one build per PR at a time; a new push supersedes the running build.
concurrency:
  group: pr-build-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://git.futuregadgetlabs.net'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Fork PRs do not get registry credentials, so they build without pushing.
      - name: Resolve PR image context
        id: ctx
        run: |
          TAG="idhan-pr-${{ github.event.number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT
          echo "cache=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG-buildcache" >> $GITHUB_OUTPUT
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: steps.ctx.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build PR image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.ctx.outputs.push == 'true' }}
          tags: ${{ steps.ctx.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.title=IDHAN (PR #${{ github.event.number }})
            net.futuregadgetlabs.idhan.pr.number=${{ github.event.number }}
            net.futuregadgetlabs.idhan.pr.url=${{ github.event.pull_request.html_url }}
            net.futuregadgetlabs.idhan.pr.head-ref=${{ github.event.pull_request.head.ref }}
            net.futuregadgetlabs.idhan.pr.base-ref=${{ github.event.pull_request.base.ref }}
          # Seed from the PR's own cache first, then fall back to the dev branch cache.
          cache-from: |
            type=registry,ref=${{ steps.ctx.outputs.cache }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-buildcache
          cache-to: ${{ steps.ctx.outputs.push == 'true' && format('type=registry,ref={0},mode=max', steps.ctx.outputs.cache) || '' }}

      - name: Summarise PR image
        run: |
          {
            if [ "${{ steps.ctx.outputs.push }}" = "true" ]; then
              echo "### PR image pushed"
              echo
              echo '```'
              echo "docker pull ${{ steps.ctx.outputs.image }}"
              echo '```'
            else
              echo "### Build succeeded (fork PR, image not pushed)"
            fi
          } >> $GITHUB_STEP_SUMMARY

  # Best effort: drop the per-PR image and its build cache once the PR is closed.
  # Needs a REGISTRY_TOKEN with package delete scope; failures are not fatal.
  cleanup:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://git.futuregadgetlabs.net' && github.event.action == 'closed'

    steps:
      - name: Delete PR image tags
        continue-on-error: true
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="idhan"
          for VERSION in "idhan-pr-${{ github.event.number }}" "idhan-pr-${{ github.event.number }}-buildcache"; do
            echo "Deleting $PACKAGE:$VERSION"
            curl -sS -o /dev/null -w '%{http_code}\n' -X DELETE \
              -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
              "${{ github.server_url }}/api/v1/packages/$OWNER/container/$PACKAGE/$VERSION"
          done

name: Build Windows Native Binary

on:
  push:
    branches: [dev, master]

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-postgresql
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-c-ares
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libarchive

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DBUILD_IDHAN_WEBUI=OFF \
            -DBUILD_HYDRUS_IMPORTER=OFF \
            -DBUILD_IDHAN_CLIENT=OFF \
            -DBUILD_IDHAN_TESTS=OFF \
            -DTRANTOR_USE_TLS=none

      - name: Build
        run: cmake --build build -j$(nproc) --target IDHANServer

      - name: Collect runtime DLLs
        run: |
          # Copy all transitive MinGW64 DLL dependencies into the output directory
          # so the binary is self-contained when distributed.
          ldd build/bin/IDHANServer.exe \
            | grep '/mingw64/' \
            | awk '{print $3}' \
            | sort -u \
            | xargs -I{} cp -n {} build/bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDHANServer-windows-x86_64
          path: |
            build/bin/IDHANServer.exe
            build/bin/*.dll
            build/bin/modules/
            build/bin/mime/
            build/bin/static/
            build/bin/config.toml

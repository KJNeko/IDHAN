name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kjneko/idhan
  PLATFORMS: linux/amd64,linux/amd64/v2,linux/amd64/v3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=tag

      - name: Set cache refs
        id: cache
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            CACHE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-buildcache"
          else
            CACHE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache"
          fi
          echo "ref=$CACHE" >> $GITHUB_OUTPUT
          {
            echo "cache_from<<EOF"
            echo "type=registry,ref=$CACHE"
            if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
              echo "type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-buildcache"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: ./.github/actions/build-image
        with:
          registry: ${{ env.REGISTRY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          platforms: ${{ env.PLATFORMS }}
          push: 'true'
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.cache_from }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max

  build-importer:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/importer-build.yml
    permissions:
      contents: read

  release:
    needs: [ build-and-push, build-importer ]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Hydrus Importer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hydrus-importer-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          {
            echo '```sh'
            echo "docker pull $IMAGE:$TAG"
            echo '```'
            echo
            echo 'Hydrus Importer for Linux x86_64 is attached below. Extract the archive and run `HydrusImporter/HydrusImporter`.'
            echo 'Built on Ubuntu 26.04; requires a compatible Linux system.'
            echo
            echo 'Hydrus Importer for Windows x86_64 is also attached. Extract the ZIP and run `HydrusImporter/HydrusImporter.exe`.'
          } > notes.md

          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "$TAG" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            $PRERELEASE

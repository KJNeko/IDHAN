name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*.*.0'
  workflow_dispatch:

env:
  REGISTRY: git.futuregadgetlabs.net
  IMAGE_NAME: kj16609/idhan
  PLATFORMS: linux/amd64,linux/amd64/v2,linux/amd64/v3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://git.futuregadgetlabs.net'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.futuregadgetlabs.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=tag

      - name: Set cache ref
        id: cache
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-buildcache" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max
          provenance: false

      - name: Determine image tag for extraction
        id: img
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          elif [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Extract Linux artifacts from image
        run: |
          set -euo pipefail
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="$REPO:${{ steps.img.outputs.tag }}"

          docker buildx imagetools inspect "$IMAGE" \
            --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}}/{{.Platform.Variant}} {{.Digest}}{{"\n"}}{{end}}' \
            > manifests.txt
          echo "Manifest entries for $IMAGE:"
          cat manifests.txt

          # "<platform key>:<artifact suffix>"; the baseline entry carries an empty variant.
          for entry in "amd64/:x86_64" "amd64/v2:x86_64-v2" "amd64/v3:x86_64-v3"; do
            key="${entry%%:*}"
            suffix="${entry##*:}"

            digest="$(awk -v k="$key" '$1 == k { print $2; exit }' manifests.txt)"
            if [ -z "$digest" ]; then
              echo "No manifest entry for platform '$key' in $IMAGE" >&2
              exit 1
            fi

            echo "Extracting $key from $digest"
            docker pull "$REPO@$digest"
            docker create --name "extract-$suffix" "$REPO@$digest"

            out="artifacts/$suffix"
            mkdir -p "$out"
            docker cp "extract-$suffix:/usr/bin/IDHANServer"          "$out/IDHANServer"
            docker cp "extract-$suffix:/usr/share/idhan/modules"      "$out/modules"
            docker cp "extract-$suffix:/usr/share/idhan/mime"         "$out/mime"
            docker cp "extract-$suffix:/usr/share/idhan/static"       "$out/static"
            docker cp "extract-$suffix:/usr/share/idhan/config.toml"  "$out/config.toml"
            docker rm "extract-$suffix"
          done

      - name: Upload Linux artifact (baseline x86-64)
        uses: actions/upload-artifact@v3
        with:
          name: IDHANServer-linux-x86_64
          path: artifacts/x86_64/

      - name: Upload Linux artifact (x86-64-v2)
        uses: actions/upload-artifact@v3
        with:
          name: IDHANServer-linux-x86_64-v2
          path: artifacts/x86_64-v2/

      - name: Upload Linux artifact (x86-64-v3)
        uses: actions/upload-artifact@v3
        with:
          name: IDHANServer-linux-x86_64-v3
          path: artifacts/x86_64-v3/

name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - dev
    tags:
      - '*'

env:
  REGISTRY: git.futuregadgetlabs.net
  IMAGE_NAME: kj16609/idhan

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://git.futuregadgetlabs.net'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.futuregadgetlabs.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=tag

      - name: Set cache ref
        id: cache
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-buildcache" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max

      - name: Determine image tag for extraction
        id: img
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          elif [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Extract Linux artifacts from image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.img.outputs.tag }}"
          docker pull "$IMAGE"
          docker create --name extract "$IMAGE"
          mkdir -p artifacts
          docker cp extract:/usr/bin/IDHANServer      artifacts/IDHANServer
          docker cp extract:/usr/share/idhan/modules  artifacts/modules
          docker cp extract:/usr/share/idhan/mime     artifacts/mime
          docker cp extract:/usr/share/idhan/static   artifacts/static
          docker cp extract:/usr/share/idhan/config.toml artifacts/config.toml
          docker rm extract

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v3
        with:
          name: IDHANServer-linux-x86_64
          path: artifacts/

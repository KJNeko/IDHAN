name: Deploy API Docs to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/api/**'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle OpenAPI spec
        run: npx --yes @redocly/cli bundle docs/api/index.yaml -o dist/openapi.yaml

      - name: Copy Swagger UI page
        run: cp docs/api/index.html dist/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: idhan-api-docs
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

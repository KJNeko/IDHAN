name: Build container image
description: Configure Buildx, optionally authenticate, and build the IDHAN image.
inputs:
  registry:
    description: Container registry hostname
    default: ghcr.io
  token:
    description: Registry token (required when pushing)
    default: ''
  push:
    description: Whether to authenticate and push the image
    default: 'false'
  platforms:
    description: Comma-separated target platforms
    default: linux/amd64
  tags:
    description: Image tags
    required: true
  labels:
    description: Image labels
    default: ''
  cache-from:
    description: BuildKit cache import sources
    default: ''
  cache-to:
    description: BuildKit cache export destination
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: inputs.token != ''
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    # Registry layer caches do not include RUN --mount=type=cache contents.
    - name: Restore Docker compiler and package caches
      id: mounts
      uses: actions/cache@v4
      with:
        path: .cache/docker-build
        key: docker-mounts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          docker-mounts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile') }}-
          docker-mounts-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Inject and extract Docker cache mounts
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        builder: ${{ steps.buildx.outputs.name }}
        scratch-dir: ${{ runner.temp }}/idhan-cache-dance
        skip-extraction: ${{ steps.mounts.outputs.cache-hit == 'true' }}
        # Ccache hashes compiler contents, headers and CPU flags. Share its bounded store
        # across CPU variants, but leave CMake build trees local to the builder.
        cache-map: |
          {
            ".cache/docker-build/ccache": {"target": "/root/.ccache", "id": "idhan-ccache-v1"},
            ".cache/docker-build/npm-amd64": {"target": "/root/.npm", "id": "idhan-npm-v1-amd64"},
            ".cache/docker-build/npm-amd64v2": {"target": "/root/.npm", "id": "idhan-npm-v1-amd64v2"},
            ".cache/docker-build/npm-amd64v3": {"target": "/root/.npm", "id": "idhan-npm-v1-amd64v3"},
            ".cache/docker-build/pnpm": {"target": "/pnpm-store", "id": "idhan-pnpm-v1", "sharing": "locked"}
          }

    - name: Build image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}

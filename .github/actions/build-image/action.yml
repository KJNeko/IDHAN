name: Build container image
description: Configure Buildx, optionally authenticate, and build the IDHAN image.
inputs:
  registry:
    description: Container registry hostname
    default: ghcr.io
  token:
    description: Registry token (required when pushing)
    default: ''
  push:
    description: Whether to authenticate and push the image
    default: 'false'
  platforms:
    description: Comma-separated target platforms
    default: linux/amd64
  tags:
    description: Image tags
    required: true
  labels:
    description: Image labels
    default: ''
  cache-from:
    description: BuildKit cache import sources
    default: ''
  cache-to:
    description: BuildKit cache export destination
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}

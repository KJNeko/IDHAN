components:
  schemas:
    TagInfo:
      $ref: ./schemas/TagInfo.yaml
    TagDomainCounts:
      $ref: ./schemas/TagDomainCounts.yaml
    Version:
      $ref: ./schemas/Version.yaml
    VersionInfo:
      $ref: ./schemas/VersionInfo.yaml
    TagColor:
      $ref: ./schemas/TagColor.yaml
    TagSet:
      $ref: ./schemas/TagSet.yaml
    TagInput:
      $ref: ./schemas/TagInput.yaml
    RescanMetadataResult:
      $ref: ./schemas/RescanMetadataResult.yaml
    NoteID:
      $ref: ./schemas/NoteID.yaml
    TagNamespace:
      $ref: ./schemas/TagNamespace.yaml
    ClusterUpdate:
      $ref: ./schemas/ClusterUpdate.yaml
    TagDomainInfo:
      $ref: ./schemas/TagDomainInfo.yaml
    JobQueued:
      $ref: ./schemas/JobQueued.yaml
    SHA256:
      $ref: ./schemas/SHA256.yaml
    TagComponent:
      $ref: ./schemas/TagComponent.yaml
    TagString:
      $ref: ./schemas/TagString.yaml
    ClusterCreate:
      $ref: ./schemas/ClusterCreate.yaml
    RecordInfo:
      $ref: ./schemas/RecordInfo.yaml
    RecordID:

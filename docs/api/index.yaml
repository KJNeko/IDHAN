  securitySchemes:
    KeyAuth:
      $ref: ./securitySchemes/KeyAuth.yaml
    QueryKeyAuth:
      type: apiKey
      in: query
      name: idhan_key
    AuthorizationKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw 64-character hexadecimal key, without a Bearer prefix.
    XKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
jsonSchemaDialect: https://spec.openapis.org/oas/3.2/dialect/2026-02-26

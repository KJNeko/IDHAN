openapi: 3.0.0
servers:
  - url: /

info:
  description: Standard API for IDHAN
  version: "0.1.0"
  title: IDHAN API
  contact:
    url: https://git.futuregadgetlabs.net/kj16609/IDHAN

tags:
  - name: public
    description: Endpoints that need no API key
  - name: auth
    description: API key management
  - name: records
    description: Files tracked by IDHAN. Creation, retrieval, tagging, and metadata.
  - name: notes
    description: Per-record text notes
  - name: urls
    description: Per-record URL associations
  - name: tags
    description: Tag creation, search, info, and relationships
  - name: tag domains
    description: Grouping tags into separate domains
  - name: clusters
    description: On-disk storage locations
  - name: search
    description: Record search
  - name: relationships
    description: Duplicates and alternatives between records
  - name: mime
    description: MIME detection and parser modules
  - name: jobs
    description: Background job dispatch and status polling
  - name: maintenance
    description: Integrity checks, purges, and rescans
  - name: database
    description: Database introspection and statistics

security:
  - KeyAuth: []

paths:

  # ── Public / info ──────────────────────────────────────────────────────────
  /version:
    $ref: './paths/version.yaml'

  # ── Auth ───────────────────────────────────────────────────────────────────
  /generate_api_key:
    $ref: './paths/auth/generate_key.yaml'

  # ── Records ────────────────────────────────────────────────────────────────
  /records/create:
    $ref: './paths/records/create.yaml'
  /records/random:
    $ref: './paths/records/random.yaml'
  /records/search:
    $ref: './paths/records/search.yaml'
  /records/{record_id}:
    $ref: './paths/records/file.yaml'
  /records/{record_id}/file:
    $ref: './paths/records/file.yaml'
  /records/{record_id}/info:
    $ref: './paths/records/info.yaml'
  /records/{record_id}/metadata:
    $ref: './paths/records/info.yaml'
  /records/{record_id}/metadata/scan:
    $ref: './paths/records/metadatascan.yaml'
  /records/{record_id}/thumbnail:
    $ref: './paths/records/thumbnail.yaml'

  # ── Record tags ────────────────────────────────────────────────────────────
  /records/tags/add:
    $ref: './paths/records/tags/addgroup.yaml'
  /records/tags/remove:
    $ref: './paths/records/tags/removegroup.yaml'
  /records/{record_id}/tags:
    $ref: './paths/records/tags/info.yaml'
  /records/{record_id}/tags/add:
    $ref: './paths/records/tags/add.yaml'
  /records/{record_id}/tags/remove:
    $ref: './paths/records/tags/remove.yaml'
  /records/{record_id}/tags/active:
    $ref: './paths/records/tags/active.yaml'
  /records/{record_id}/tags/active/verbose:
    $ref: './paths/records/tags/activeverbose.yaml'

  # ── Record notes ───────────────────────────────────────────────────────────
  /records/{record_id}/notes:
    $ref: './paths/records/notes/get_notes.yaml'
  /records/{record_id}/add_note:
    $ref: './paths/records/notes/add_note.yaml'
  /records/{record_id}/remove_note/{note_id}:
    $ref: './paths/records/notes/remove_note.yaml'

  # ── Record URLs ────────────────────────────────────────────────────────────
  /records/{record_id}/urls:
    $ref: './paths/records/urls/fetch.yaml'
  /records/{record_id}/urls/add:
    $ref: './paths/records/urls/add.yaml'
  /records/{record_id}/urls/remove:
    $ref: './paths/records/urls/remove.yaml'

  # ── Tags ───────────────────────────────────────────────────────────────────
  /tags/create:
    $ref: './paths/tags/create.yaml'
  /tags/search:
    $ref: './paths/tags/search.yaml'
  /tags/autocomplete:
    $ref: './paths/tags/autocomplete.yaml'
  /tags/{tag_id}/info:
    $ref: './paths/tags/info.yaml'

  # ── Tag domains ────────────────────────────────────────────────────────────
  /tags/domain/create:
    $ref: './paths/tags/domains/create.yaml'
  /tags/domain/list:
    $ref: './paths/tags/domains/list.yaml'
  /tags/domain/{tag_domain_id}/info:
    $ref: './paths/tags/domains/info.yaml'
  /tags/domain/{tag_domain_id}/delete:
    $ref: './paths/tags/domains/delete.yaml'

  # ── Tag relationships ──────────────────────────────────────────────────────
  /tags/{domain_id}/{tag_id}/relationships:
    $ref: './paths/tags/relationships/get.yaml'
  /tags/parents/create:
    $ref: './paths/tags/relationships/parent/create.yaml'
  /tags/parents/remove:
    $ref: './paths/tags/relationships/parent/remove.yaml'
  /tags/alias/create:
    $ref: './paths/tags/relationships/alias/create.yaml'
  /tags/alias/remove:
    $ref: './paths/tags/relationships/alias/remove.yaml'
  /tags/siblings/create:
    $ref: './paths/tags/relationships/sibling/create.yaml'
  /tags/siblings/remove:
    $ref: './paths/tags/relationships/sibling/remove.yaml'

  # ── Clusters ───────────────────────────────────────────────────────────────
  /clusters/add:
    $ref: './paths/clusters/add.yaml'
  /clusters/list:
    $ref: './paths/clusters/list.yaml'
  /clusters/{cluster_id}/info:
    $ref: './paths/clusters/info.yaml'
  /clusters/{cluster_id}/modify:
    $ref: './paths/clusters/modify.yaml'
  /clusters/{cluster_id}/remove:
    $ref: './paths/clusters/remove.yaml'
  /clusters/{cluster_id}/scan:
    $ref: './paths/clusters/scan.yaml'

  # ── Search ─────────────────────────────────────────────────────────────────
  /search:
    $ref: './paths/search/search.yaml'

  # ── File import ────────────────────────────────────────────────────────────
  /file/import:
    $ref: './paths/file/import.yaml'

  # ── File relationships ─────────────────────────────────────────────────────
  /relationships/duplicates/add:
    $ref: './paths/relationships/duplicates/add.yaml'
  /relationships/alternatives/add:
    $ref: './paths/relationships/alternatives/add.yaml'

  # ── MIME ───────────────────────────────────────────────────────────────────
  /mime/parse:
    $ref: './paths/mime/parse.yaml'
  /mime/generate_thumbnail:
    $ref: './paths/mime/generate_thumbnail.yaml'

  # ── Jobs ───────────────────────────────────────────────────────────────────
  /jobs/metadata/rescan:
    $ref: './paths/jobs/rescan_metadata.yaml'
  /jobs/{job_id}/status:
    $ref: './paths/jobs/status.yaml'
  /jobs/status:
    $ref: './paths/jobs/status_all.yaml'

  # ── Maintenance ────────────────────────────────────────────────────────────
  /integrity:
    $ref: './paths/integrity.yaml'
  /purge/thumbnails:
    $ref: './paths/purge/thumbnails.yaml'

  # ── Database stats ─────────────────────────────────────────────────────────
  /db/stats/sunburst:
    $ref: './paths/db/stats/sunburst.yaml'

components:
  schemas:
    TagInfo:
      $ref: './schemas/TagInfo.yaml'
    Version:
      $ref: './schemas/Version.yaml'
    VersionInfo:
      $ref: './schemas/VersionInfo.yaml'
    TagColor:
      $ref: './schemas/TagColor.yaml'
    TagSet:
      $ref: './schemas/TagSet.yaml'
    TagInput:
      $ref: './schemas/TagInput.yaml'
  securitySchemes:
    KeyAuth:
      $ref: './securitySchemes/KeyAuth.yaml'

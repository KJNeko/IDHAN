type: object
description: >
  Only `record_id` and `hashes` are always present. Everything else appears
  once the record's MIME type has been parsed, and then only for the MIME
  categories noted on each field.
required:
  - record_id
  - hashes
properties:
  record_id:
    $ref: 'RecordID.yaml'
  hashes:
    type: object
    required:
      - sha256
    properties:
      sha256:
        $ref: 'SHA256.yaml'
  size:
    type: integer
    format: int64
    description: Bytes.
  mime:
    type: string
    example: "image/jpeg"
  extension:
    type: string
    description: Best extension for the type.
    example: "jpg"
  extra:
    type: object
    description: Freeform metadata from the `metadata.json` column.
    additionalProperties: true
  width:
    type: integer
    format: int32
    description: Pixels. Images, videos, and image projects.
    example: 1920
  height:
    type: integer
    format: int32
    description: Pixels. Images, videos, and image projects.
    example: 1080
  channels:
    type: integer
    format: int32
    description: Colour channels. Images and image projects.
    example: 3
  has_exif:
    type: boolean
    description: >
      Images. The file carries an EXIF block. Absent when the image was parsed
      before embedded metadata was looked for, which is not the same as false.
    example: true
  has_gps:
    type: boolean
    description: Images. The EXIF block carries a GPS position.
    example: false
  has_xmp:
    type: boolean
    description: Images. The file carries an XMP packet.
    example: false
  has_iptc:
    type: boolean
    description: Images. The file carries an IPTC block.
    example: false
  has_icc_profile:
    type: boolean
    description: Images. The file carries an embedded ICC colour profile.
    example: true
  duration:
    type: number
    format: double
    description: Seconds. Videos.
    example: 120.5
  bitrate:
    type: integer
    format: int32
    description: Bits per second. Videos.
    example: 4000000
  has_audio:
    type: boolean
    description: Videos.
    example: true
  layers:
    type: integer
    format: int32
    description: Image projects, such as PSD.
    example: 5

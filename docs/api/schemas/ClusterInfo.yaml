type: object
properties:
  cluster_id:
    type: integer
    readOnly: true
  readonly:
    type: boolean
    description: IDHAN will not add, move, or rename media files in this cluster. Identity marker initialization and acknowledged recovery are permitted.
  name:
    type: string
  path:
    type: string
    examples:
      - /mnt/media/idhan
  size:
    type: object
    properties:
      used:
        type: integer
        readOnly: true
        format: int64
        description: Bytes assigned through file_info; maintained by database triggers.
      limit:
        type: integer
        description: Byte ceiling. 0 means unlimited.
        default: 0
        format: int64
      available:
        type: integer
        readOnly: true
        format: int64
        description: Configured limit minus assigned bytes, or int64 maximum when unlimited. May be negative.
  file_count:
    type: integer
    readOnly: true
  ratio_number:
    description: The stored `ratio`.
    type: integer
    readOnly: true
  by_mime:
    type: array
    items:
      type: object
      properties:
        mime:
          type:
            - string
            - 'null'
        count:
          type: integer
          format: int64
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
      required:
        - mime
        - count
        - bytes
required:
  - cluster_id
  - readonly
  - name
  - path
  - size
  - file_count
  - ratio_number
  - by_mime

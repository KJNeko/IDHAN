type: object
properties:
  cluster_id:
    type: integer
    readOnly: true
  readonly:
    type: boolean
    default: true
    description: IDHAN will not add, move, or rename files in this cluster.
  name:
    type: string
  path:
    type: string
    example: /mnt/media/idhan
  size:
    type: object
    properties:
      used:
        type: integer
        readOnly: true
      limit:
        type: integer
        description: Byte ceiling. 0 means unlimited.
        default: 0
      available:
        type: integer
        readOnly: true
  file_count:
    type: integer
    readOnly: true
  ratio:
    description: >
      Weight used when picking a cluster for new files: this cluster's ratio
      over the sum of all ratios. Reads return it as `ratio_number`.
    type: integer
    example: 1
    default: 1
    writeOnly: true
  ratio_number:
    description: The stored `ratio`.
    type: integer
    readOnly: true
required:
  - name
  - path

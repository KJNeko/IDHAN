type: object
properties:
  branch:
    type: string
    examples:
      - master
  build:
    type: string
    examples:
      - Debug
  commit:
    type: string
    examples:
      - 5f9617d
  idhan_server_version:
    $ref: ./Version.yaml
  idhan_api_version:
    $ref: ./Version.yaml
  tag:
    type: string
    examples:
      - v1.0
  unsynced:
    type: integer
    description: 1 if built from a dirty working tree, 0 otherwise.
    examples:
      - 0
  build_on:
    type: string
    description: Compile date and time.
    examples:
      - Jun 25 2026, 12:34:56
required:
  - branch
  - build
  - commit
  - idhan_server_version
  - idhan_api_version
  - tag
  - unsynced
  - build_on

description: The RGB components are provided alongside the hex for convenience.
type: object
properties:
  hex:
    type: string
    examples:
      - F0F0F0
  r:
    type: integer
    minimum: 0
    maximum: 255
  g:
    type: integer
    minimum: 0
    maximum: 255
  b:
    type: integer
    minimum: 0
    maximum: 255

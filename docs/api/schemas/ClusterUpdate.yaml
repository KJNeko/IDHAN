type: object
properties:
  name:
    type: string
    minLength: 1
  path:
    type: string
    minLength: 1
    description: Accepted in the body but currently ignored when modifying a cluster.
    examples:
      - /mnt/media/idhan
  readonly:
    type: boolean
    description: >-
      When true, IDHAN will not add, move, or rename media files in this cluster
      and will not create a missing identity marker. Changing to false initializes
      a missing marker with the registered UUID and requires filesystem write permission.
  ratio:
    description: 'Weight used when picking a cluster for new files: this cluster''s ratio over the sum
      of all ratios. Reads return it as `ratio_number`.'
    type: integer
    minimum: 0
    maximum: 32767
    examples:
      - 1
  size:
    type: object
    properties:
      limit:
        type: integer
        format: int64
        minimum: 0
        default: 0

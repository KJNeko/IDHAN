type: object
properties:
  id:
    type: integer
    format: int64
  parent_id:
    type:
      - integer
      - 'null'
    format: int64
  url:
    type: string
  state:
    type: string
  created_at:
    type: integer
    format: int64
  finished_at:
    type:
      - integer
      - 'null'
    format: int64
  error:
    type:
      - string
      - 'null'
  note:
    type:
      - string
      - 'null'
  record_id:
    type:
      - integer
      - 'null'
  urls:
    type: array
    items:
      $ref: DownloadUrl.yaml
  record_ids:
    type: array
    items:
      $ref: RecordID.yaml
required:
  - id
  - parent_id
  - url
  - state
  - created_at
  - finished_at
  - error
  - note
  - record_id
  - urls
  - record_ids

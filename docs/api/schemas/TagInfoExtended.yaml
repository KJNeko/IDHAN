type: object
allOf:
  - $ref: 'TagInfo.yaml'
  - type: object
    properties:
      namespace:
        type: object
        properties:
          id:
            type: integer
          text:
            type: string
            example: "character"
      subtag:
        type: object
        properties:
          id:
            type: integer
          text:
            type: string
            example: "toujou koneko"
      items_count:
        type: integer
        description: Records carrying this tag.

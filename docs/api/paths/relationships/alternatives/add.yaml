post:
  tags:
    - relationships
  summary: Adds records to an alternative group
  description: |
    Groups records as alternatives of each other, for example different crops
    of one image. Any groups the records already belong to are merged.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../../schemas/RecordID.yaml'
          minItems: 2
        examples:
          group:
            summary: Group three records as alternatives
            value:
              - 1
              - 2
              - 3
  responses:
    200:
      description: Records grouped
      content:
        application/json:
          schema:
            type: object
    400:
      description: Invalid request body
    500:
      description: Internal server error

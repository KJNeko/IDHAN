post:
  tags:
    - relationships
  summary: Pairs records as alternatives
  description: |-
    Marks records as alternatives of each other, for example different crops of
    one image. Every listed record is paired with every other one; the pairing is
    direct, so it never reaches records already paired with these elsewhere.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../../schemas/RecordID.yaml
          minItems: 2
        examples:
          group:
            summary: Pair three records as alternatives
            value:
              - 1
              - 2
              - 3
  responses:
    '404':
      description: A referenced record does not exist.
      content:
        text/plain:
          schema:
            type: string
    '200':
      description: Records paired
      content:
        application/json:
          schema:
            type: object
    '400':
      description: Invalid request body
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string

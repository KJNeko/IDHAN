get:
  tags:
    - relationships
  summary: Returns duplicate king assignments and group alternatives
  responses:
    '200':
      description: Returns duplicate king assignments and group alternatives
      content:
        application/json:
          schema:
            type: object
            properties:
              inferior:
                type: array
                items:
                  $ref: ../../schemas/RecordID.yaml
              superior:
                type: array
                items:
                  $ref: ../../schemas/RecordID.yaml
              alternatives:
                type: array
                items:
                  $ref: ../../schemas/RecordID.yaml
            required:
              - inferior
              - superior
              - alternatives
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: Requested resource is unavailable.
      content:
        text/plain:
          schema:
            type: string
  parameters:
    - name: record_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1

get:
  tags:
    - relationships
  summary: Next duplicate pair awaiting a decision
  description: |
    Returns pairs of records that are perceptually similar and hold no relationship yet,
    walked one record at a time and closest first within each, so a run of calls works
    through everything one file could be. Backs the "next unresolved" button in the UI:
    every decision available there takes the pair out of this queue, so calling it
    repeatedly walks forward.

    Reads `hamming_distance`, which is the queue itself: ruling a pair a duplicate, an
    alternative or a coincidental lookalike discards the distance between them, and
    clearing that ruling has both records measured again.
  parameters:
    - name: distance
      in: query
      required: false
      description: >
        Largest perceptual-hash distance to consider, in differing bits. Defaults to
        8, which is also the furthest apart any stored pair can be.
      schema:
        type: integer
        minimum: 0
        maximum: 8
        default: 8
    - name: limit
      in: query
      required: false
      description: >
        How many pairs to return, in the order they come up. The default of 1 answers
        "what do I rule on next"; a client that reads the images ahead of the user asks
        for more.
      schema:
        type: integer
        minimum: 0
        maximum: 32
        default: 1
  responses:
    200:
      description: The next pair, or none left within the distance
      content:
        application/json:
          schema:
            type: object
            required:
              - distance
              - pair
              - pairs
            properties:
              distance:
                type: integer
                description: The maximum distance that was searched, echoed back.
              pair:
                nullable: true
                description: >
                  The head of `pairs`, repeated for callers ruling one pair at a time.
                  Null once every pair within the distance has been ruled on.
                type: object
                required:
                  - record_id_a
                  - record_id_b
                  - distance
                properties:
                  record_id_a:
                    $ref: '../../../schemas/RecordID.yaml'
                  record_id_b:
                    $ref: '../../../schemas/RecordID.yaml'
                  distance:
                    type: integer
                    description: Differing bits between the two perceptual hashes.
              pairs:
                type: array
                description: >
                  At most `limit` pairs, ordered by the lower record id and then by distance.
                  Empty once none are left.
                items:
                  type: object
                  required:
                    - record_id_a
                    - record_id_b
                    - distance
                  properties:
                    record_id_a:
                      $ref: '../../../schemas/RecordID.yaml'
                    record_id_b:
                      $ref: '../../../schemas/RecordID.yaml'
                    distance:
                      type: integer
                      description: Differing bits between the two perceptual hashes.
          examples:
            pending:
              summary: A pair to rule on
              value:
                distance: 8
                pair:
                  record_id_a: 12
                  record_id_b: 40
                  distance: 2
                pairs:
                  - record_id_a: 12
                    record_id_b: 40
                    distance: 2
            exhausted:
              summary: Nothing left within the distance
              value:
                distance: 8
                pair: null
                pairs: []
    400:
      description: >
        distance was not an unsigned integer, or was greater than 8; or limit was not an
        unsigned integer, or was greater than 32
    500:
      description: Internal server error

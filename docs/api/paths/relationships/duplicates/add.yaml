post:
  tags:
    - relationships
  summary: Marks one record as a better-quality duplicate of another
  description: |
    Directional: `better_id` is the record to keep, `worse_id` the duplicate.
    Takes a single object or an array of them.
    Stores an immediate inferior-to-superior link. If B is inferior to A, marking C
    inferior to B preserves C → B → A. Clearing B → A leaves C → B intact.
    Replacing a record's superior moves its descendants with it. If the chosen
    superior is one of its descendants, that superior first takes its former place
    in the chain, preventing a cycle. Roots are derived through a recursive view.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - type: object
              required:
                - worse_id
                - better_id
              properties:
                worse_id:
                  $ref: '../../../schemas/RecordID.yaml'
                better_id:
                  $ref: '../../../schemas/RecordID.yaml'
            - type: array
              items:
                type: object
                required:
                  - worse_id
                  - better_id
                properties:
                  worse_id:
                    $ref: '../../../schemas/RecordID.yaml'
                  better_id:
                    $ref: '../../../schemas/RecordID.yaml'
        examples:
          single:
            summary: Single duplicate pair
            value:
              worse_id: 5
              better_id: 10
          batch:
            summary: Multiple duplicate pairs
            value:
              - worse_id: 5
                better_id: 10
              - worse_id: 7
                better_id: 12
  responses:
    200:
      description: Relationships recorded
      content:
        application/json:
          schema:
            type: object
    400:
      description: Invalid request body

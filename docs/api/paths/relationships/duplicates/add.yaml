post:
  tags:
    - relationships
  summary: Marks one record as a better-quality duplicate of another
  description: |
    Establishes a directional duplicate relationship: `better_id` is the preferred record,
    `worse_id` is the lower-quality duplicate. Accepts either a single object or an array
    for batch operations.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - type: object
              required:
                - worse_id
                - better_id
              properties:
                worse_id:
                  allOf:
                    - $ref: '../../../schemas/RecordID.yaml'
                  description: The lower-quality duplicate record
                better_id:
                  allOf:
                    - $ref: '../../../schemas/RecordID.yaml'
                  description: The preferred higher-quality record
            - type: array
              items:
                type: object
                required:
                  - worse_id
                  - better_id
                properties:
                  worse_id:
                    $ref: '../../../schemas/RecordID.yaml'
                  better_id:
                    $ref: '../../../schemas/RecordID.yaml'
        examples:
          single:
            summary: Single duplicate pair
            value:
              worse_id: 5
              better_id: 10
          batch:
            summary: Multiple duplicate pairs
            value:
              - worse_id: 5
                better_id: 10
              - worse_id: 7
                better_id: 12
  responses:
    200:
      description: Duplicate relationship(s) recorded
      content:
        application/json:
          schema:
            type: object
    400:
      description: Invalid request body

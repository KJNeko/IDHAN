get:
  tags:
    - tags
  summary: Returns one tag using a query parameter
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../../schemas/TagInfoExtended.yaml
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: A requested tag domain does not exist.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
  parameters:
    - $ref: ../../parameters/tag_domains.yaml
    - name: tag_id
      in: query
      required: false
      schema:
        $ref: ../../schemas/TagID.yaml
    - name: tag_ids
      in: query
      required: false
      schema:
        $ref: ../../schemas/TagID.yaml
  description: Supply tag_id or its singular alias tag_ids. Only one integral ID is accepted; tag_id takes
    precedence. Returns domain-specific storage and display counts with the same
    independently calculated maxima and domain selection as the path-based tag-info endpoint.

get:
  tags:
    - tags
    - search
  summary: Autocompletes tags from a partial input
  description: >
    Similarity search over tag text. Ordered by exact match, then by similarity
    weighted by use count, then by similarity alone.
  parameters:
    - in: query
      name: tag
      schema:
        type: string
        default: ""
      required: true
      description: Partial tag text. A leading `-` is stripped if present.
    - in: query
      name: limit
      schema:
        type: integer
        default: 10
        maximum: 32
      required: false
      description: Clamped to 32 if a larger value is given.
    - in: query
      name: include_unused
      schema:
        type: boolean
        default: true
      required: false
      description: When false, only tags applied to at least one record are returned.
    - in: query
      name: tag_display_type
      schema:
        type: string
        enum:
          - storage
          - display
        default: storage
      required: false
      description: >
        Which use count feeds the score. `storage` is the raw count, `display`
        is the count after relationship resolution.
  responses:
    "200":
      description: Matches, best first
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                tag_id:
                  type: integer
                  example: 42
                tag_text:
                  type: string
                  description: Full tag text, or just the subtag if the namespace is empty.
                  example: "species:catgirl"
                similarity:
                  type: number
                  format: double
                  description: PostgreSQL `similarity()` score, 0.0 to 1.0.
                  example: 0.8
                count:
                  type: integer
                  description: Records this tag is applied to.
                  example: 17
              required:
                - tag_id
                - value
                - tag_text
                - similarity
                - count
          examples:
            CatQuery:
              summary: Query was 'cat'
              value:
                - tag_id: 1
                  value: "species:catgirl"
                  tag_text: "species:catgirl"
                  similarity: 0.5
                  count: 120
                - tag_id: 2
                  value: "cat ears"
                  tag_text: "cat ears"
                  similarity: 0.36
                  count: 45
    "400":
      description: Invalid `tag_display_type`
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid tag display type"

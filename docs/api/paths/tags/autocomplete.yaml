get:
  tags:
    - tags
    - search
  summary: Returns a list of tags that best match a given partial input.
  description: >
    Searches for tags whose text matches the given `tag` input using PostgreSQL
    similarity scoring. Results are ordered by exact match first, then by a
    combined score of similarity and display count, then by similarity alone.
    The `limit` is capped at a hard maximum of 32 regardless of the value
    supplied.
  parameters:
    - in: query
      name: tag
      schema:
        type: string
        default: ""
      required: true
      description: Partial text of a tag to search. A leading `-` is treated as a negation prefix and stripped before matching.
    - in: query
      name: limit
      schema:
        type: integer
        default: 10
        maximum: 32
      required: false
      description: Maximum number of results to return. Values above 32 are silently clamped to 32.
    - in: query
      name: include_unused
      schema:
        type: boolean
        default: true
      required: false
      description: >
        When `true` (default), tags with a display count of zero are included in
        results. When `false`, only tags that have been applied to at least one
        record are returned.
    - in: query
      name: tag_display_type
      schema:
        type: string
        enum:
          - storage
          - display
        default: storage
      required: false
      description: >
        Controls which count perspective is used for scoring. `storage` (default)
        uses the raw storage count; `display` uses the display count after tag
        relationship resolution. An invalid value results in a 400 response.

  responses:
    "200":
      description: >
        An array of tag match objects ordered from greatest similarity to least.
        Each object contains both a `value`/`tag_text` field (the full tag
        string) and scoring metadata.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                tag_id:
                  type: integer
                  description: Unique identifier for the tag.
                  example: 42
                value:
                  type: string
                  description: Full tag text (same as `tag_text`). Provided for UI convenience.
                  example: "species:catgirl"
                tag_text:
                  type: string
                  description: Full tag text in `namespace:subtag` form (or just the subtag when the namespace is empty).
                  example: "species:catgirl"
                similarity:
                  type: number
                  format: double
                  description: PostgreSQL `similarity()` score between the search input and this tag (0.0–1.0).
                  example: 0.8
                count:
                  type: integer
                  description: Display count — number of records this tag is applied to.
                  example: 17
              required:
                - tag_id
                - value
                - tag_text
                - similarity
                - count
          examples:
            CatQuery:
              summary: Query was 'cat'
              value:
                - tag_id: 1
                  value: "species:catgirl"
                  tag_text: "species:catgirl"
                  similarity: 0.5
                  count: 120
                - tag_id: 2
                  value: "cat ears"
                  tag_text: "cat ears"
                  similarity: 0.36
                  count: 45
    "400":
      description: >
        Returned when `tag_display_type` is supplied but is not one of the
        accepted values (`storage` or `display`).
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid tag display type"

post:
  tags:
    - tags
  summary: Removes parent/child relationships between tags
  parameters:
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: ../../../../schemas/TagDomainID.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            required:
              - parent_id
              - child_id
            properties:
              parent_id:
                $ref: ../../../../schemas/TagID.yaml
              child_id:
                $ref: ../../../../schemas/TagID.yaml
        examples:
          remove_parent:
            summary: Remove parent/child relationship
            value:
              - parent_id: 10
                child_id: 20
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
    '400':
      description: Invalid request body
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string

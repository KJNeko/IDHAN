post:
  tags:
    - tags
  summary: Creates parent/child relationships between tags
  parameters:
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: '../../../../schemas/TagDomainID.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              parent_id:
                $ref: '../../../../schemas/TagID.yaml'
              child_id:
                $ref: '../../../../schemas/TagID.yaml'
  responses:
    200:
      description: Relationships created
    400:
      description: Missing or invalid `tag_domain_id`, body is not a JSON array, or a non-integer ID
    500:
      description: Internal server error

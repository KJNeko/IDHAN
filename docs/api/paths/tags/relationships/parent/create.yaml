post:
  tags:
    - parents
  description: Creates a parent/child relationship between two tags
  parameters:
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: '../../../../schemas/TagDomainID.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              parent_id:
                $ref: '../../../../schemas/TagID.yaml'
              child_id:
                $ref: '../../../../schemas/TagID.yaml'
  responses:
    200:
      description: All parent/child relationships created successfully
    400:
      description: |
        Bad request. Possible causes:
        - Missing or invalid `tag_domain_id` query parameter
        - Request body is not valid JSON
        - JSON root is not an array
        - A `parent_id` or `child_id` value is not an integer
    500:
      description: Internal server error while inserting into the database
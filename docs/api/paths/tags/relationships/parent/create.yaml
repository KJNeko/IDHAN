post:
  tags:
    - tags
  summary: Creates parent/child relationships between tags
  parameters:
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: ../../../../schemas/TagDomainID.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              parent_id:
                $ref: ../../../../schemas/TagID.yaml
              child_id:
                $ref: ../../../../schemas/TagID.yaml
            required:
              - parent_id
              - child_id
  responses:
    '409':
      description: The requested relationship would introduce a cycle in the existing graph; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: The tag domain or a referenced tag does not exist.
      content:
        text/plain:
          schema:
            type: string
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
    '400':
      description: Missing or invalid `tag_domain_id`, body is not a JSON array, or a non-integer ID
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string

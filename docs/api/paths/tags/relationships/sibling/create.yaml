post:
  tags:
    - tags
  summary: Creates sibling (exclusive tag) relationships
  description: |
    Marks two tags as mutually exclusive. When a record has both, `older_id` is
    shown and `younger_id` is hidden, along with the younger tag's parents.
    A tag cannot be its own sibling. Duplicates are ignored.
  parameters:
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: '../../../../schemas/TagDomainID.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            required:
              - older_id
              - younger_id
            properties:
              older_id:
                allOf:
                  - $ref: '../../../../schemas/TagID.yaml'
                description: The shown tag.
              younger_id:
                allOf:
                  - $ref: '../../../../schemas/TagID.yaml'
                description: The hidden tag.
        examples:
          rating_siblings:
            summary: Make rating:safe and rating:explicit exclusive
            value:
              - older_id: 50
                younger_id: 51
  responses:
    200:
      description: Relationships created
    400:
      description: Invalid request body
    500:
      description: Internal server error

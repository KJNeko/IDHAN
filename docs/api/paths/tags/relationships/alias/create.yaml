post:
  tags:
    - tags
  summary: Creates alias relationships between tags
  description: |-
    A record tagged `aliased_id` resolves to `alias_id` in resolved tag views.
    A tag cannot alias itself. Duplicates are ignored.
  parameters:
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: ../../../../schemas/TagDomainID.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            required:
              - aliased_id
              - alias_id
            properties:
              aliased_id:
                allOf:
                  - $ref: ../../../../schemas/TagID.yaml
                description: The old tag.
              alias_id:
                allOf:
                  - $ref: ../../../../schemas/TagID.yaml
                description: The canonical target.
        examples:
          create_alias:
            summary: Alias tag 10 to canonical tag 20
            value:
              - aliased_id: 10
                alias_id: 20
  responses:
    '409':
      description: The requested relationship would introduce a cycle in the existing graph; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: The tag domain or a referenced tag does not exist.
      content:
        text/plain:
          schema:
            type: string
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
    '400':
      description: Invalid request body
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

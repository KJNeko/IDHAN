post:
  tags:
    - tags
  summary: Creates alias relationships between tags
  description: |
    A record tagged `aliased_id` resolves to `alias_id` in resolved tag views.
    A tag cannot alias itself. Duplicates are ignored.
  parameters:
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: '../../../../schemas/TagDomainID.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            required:
              - aliased_id
              - alias_id
            properties:
              aliased_id:
                allOf:
                  - $ref: '../../../../schemas/TagID.yaml'
                description: The old tag.
              alias_id:
                allOf:
                  - $ref: '../../../../schemas/TagID.yaml'
                description: The canonical target.
        examples:
          create_alias:
            summary: Alias tag 10 to canonical tag 20
            value:
              - aliased_id: 10
                alias_id: 20
  responses:
    200:
      description: Aliases created
      content:
        application/json:
          schema:
            nullable: true
    400:
      description: Invalid request body

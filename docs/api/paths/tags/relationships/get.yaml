get:
  tags:
    - tags
  summary: Returns a tag's relationships
  description: |
    Parents, children, siblings, and aliases for the tag, within the given domain.
  parameters:
    - name: domain_id
      in: path
      required: true
      schema:
        $ref: '../../../schemas/TagDomainID.yaml'
    - name: tag_id
      in: path
      required: true
      schema:
        $ref: '../../../schemas/TagID.yaml'
  responses:
    '200':
      description: The tag's relationships
      content:
        application/json:
          schema:
            type: object
            required: [ parents, children, older_siblings, younger_siblings, aliases, aliased ]
            properties:
              parents:
                type: array
                items:
                  $ref: '../../../schemas/TagID.yaml'
              children:
                type: array
                items:
                  $ref: '../../../schemas/TagID.yaml'
              older_siblings:
                type: array
                items:
                  $ref: '../../../schemas/TagID.yaml'
              younger_siblings:
                type: array
                items:
                  $ref: '../../../schemas/TagID.yaml'
              aliases:
                type: array
                items:
                  $ref: '../../../schemas/TagID.yaml'
                description: Tags that alias to this one.
              aliased:
                type: array
                items:
                  $ref: '../../../schemas/TagID.yaml'
                description: Tags this one aliases to.
          examples:
            with_relationships:
              summary: Tag with a parent and an alias
              value:
                parents: [ 5 ]
                children: [ ]
                older_siblings: [ ]
                younger_siblings: [ ]
                aliases: [ 12 ]
                aliased: [ ]
            no_relationships:
              summary: Tag with no relationships
              value:
                parents: [ ]
                children: [ ]
                older_siblings: [ ]
                younger_siblings: [ ]
                aliases: [ ]
                aliased: [ ]

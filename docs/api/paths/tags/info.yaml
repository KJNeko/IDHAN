get:
  tags:
    - tags
  summary: Returns information about a tag
  parameters:
    - in: path
      name: tag_id
      required: true
      schema:
        $ref: '../../schemas/TagID.yaml'
  responses:
    "200":
      description: Tag info
      content:
        application/json:
          schema:
            $ref: '../../schemas/TagInfoExtended.yaml'
    "400":
      description: Tag not found, or not yet committed

delete:
  tags:
    - tag domains
  summary: Deletes a tag domain
  parameters:
    - in: path
      name: tag_domain_id
      required: true
      schema:
        $ref: '../../../schemas/TagDomainID.yaml'
  responses:
    200:
      description: Tag domain deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              tag_domain_id:
                $ref: '../../../schemas/TagDomainID.yaml'
    400:
      description: Tag domain not found

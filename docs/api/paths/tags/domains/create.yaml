post:
  tags:
    - tag domains
  summary: Creates a tag domain
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              examples:
                - my domain
  responses:
    '200':
      description: The new domain
      content:
        application/json:
          schema:
            $ref: ../../../schemas/TagDomainInfo.yaml
    '400':
      description: Missing body, invalid JSON, or `name` absent or not a string
      content:
        text/plain:
          schema:
            type: string
    '409':
      description: Name already exists; returns that domain.
      content:
        application/json:
          schema:
            $ref: ../../../schemas/TagDomainInfo.yaml
    '500':
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string

post:
  tags:
    - tag domains
  summary: Creates a tag domain
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              example: "my domain"
  responses:
    "200":
      description: The new domain
      content:
        application/json:
          schema:
            $ref: '../../../schemas/TagDomainInfo.yaml'
    "400":
      description: Missing body, invalid JSON, or `name` absent or not a string
    "409":
      description: Name already taken. The existing domain is returned.
      content:
        application/json:
          schema:
            $ref: '../../../schemas/TagDomainInfo.yaml'
    "500":
      description: Internal server error

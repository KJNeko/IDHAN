get:
  tags:
    - tag domains
  summary: Returns information about a tag domain
  parameters:
    - in: path
      name: tag_domain_id
      required: true
      schema:
        $ref: '../../../schemas/TagDomainID.yaml'
  responses:
    '200':
      description: Domain info
      content:
        application/json:
          schema:
            $ref: '../../../schemas/TagDomainInfo.yaml'
    '400':
      description: Tag domain not found

post:
  tags:
    - tags
  summary: Create tags and return their IDs
  description: >
    Accepts an array of namespace/subtag pairs and creates any tags that do not
    already exist. Returns an array of tag IDs in the same order as the input.
    If a tag already exists its existing ID is returned unchanged.
  requestBody:
    description: Array of namespace/subtag string pairs
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            required:
              - namespace
              - subtag
            properties:
              namespace:
                type: string
                description: >
                  The namespace component of the tag. Use an empty string for
                  tags with no namespace (e.g. a plain "catgirl" tag).
                example: "character"
              subtag:
                type: string
                example: "toujou koneko"
        examples:
          single:
            summary: Single tag (as a one-element array)
            value:
              - namespace: "character"
                subtag: "toujou koneko"
          noNamespace:
            summary: Tag with no namespace
            description: Use an empty string for the namespace when the tag has no prefix.
            value:
              - namespace: ""
                subtag: "catgirl"
          multiple:
            summary: Multiple tags
            value:
              - namespace: "character"
                subtag: "toujou koneko"
              - namespace: "series"
                subtag: "Highschool DxD"

  responses:
    "200":
      description: Array of tag IDs in the same order as the request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../schemas/TagInfo.yaml'
          examples:
            single:
              summary: Response for a one-element input array
              value:
                - tag_id: 42
            multiple:
              summary: Response for a multi-element input array
              value:
                - tag_id: 42
                - tag_id: 7
    "400":
      description: >
        Bad request. Returned when the request body is missing, the array is
        empty, or any element has a namespace or subtag that is not a string.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
          examples:
            noBody:
              summary: No JSON body provided
              value:
                error: "No json data"
            emptyArray:
              summary: Empty array
              value:
                error: "No tags to create"
            invalidNamespace:
              summary: Namespace is not a string
              value:
                error: "Invalid namespace: Expected string"
            invalidSubtag:
              summary: Subtag is not a string
              value:
                error: "Invalid subtag: Expected string"
    "500":
      description: Internal server error while inserting tags into the database.

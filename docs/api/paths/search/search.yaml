get:
  tags:
    - search
  summary: Searches for records using tag IDs
  description: Returns record IDs matching the positive tag filter. tag_ids takes precedence; if empty
    or absent, tag_id is used. Both accept repeated integral values. Defaults to file size ascending.
  parameters:
    - name: tag_ids
      in: query
      description: Positive tag IDs to intersect. Repeat the parameter for multiple values (`?tag_ids=1&tag_ids=2`).
      required: false
      schema:
        type: array
        items:
          $ref: ../../schemas/TagID.yaml
    - name: tag_id
      in: query
      description: Repeated-value alias used when tag_ids is empty or absent.
      required: false
      schema:
        type: array
        items:
          $ref: ../../schemas/TagID.yaml
    - name: tag_domains
      in: query
      description: Restricts the search to these tag domains.
      required: false
      schema:
        type: array
        items:
          $ref: ../../schemas/TagDomainID.yaml
    - name: by
      in: query
      description: Sort key. Defaults to `filesize` when omitted; unknown names return 400.
      required: false
      schema:
        $ref: ../../schemas/SearchSortMethod.yaml
        default: filesize
    - name: order
      in: query
      description: Defaults to `asc`.
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
  responses:
    '200':
      description: Matching record IDs, empty when nothing matches
      content:
        application/json:
          schema:
            type: array
            items:
              type: integer
              description: record_id
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '400':
      description: Invalid parameters, including an unknown sorting method. The body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
post:
  tags:
    - search
  summary: Full-featured record search
  description: Search endpoint with negations, and system predicates.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            tags:
              type: array
              items:
                type: string
              description: Tag text. A leading `-` negates the tag if present. A `system:` prefix is parsed
                as a system predicate (width, height, filesize, limit, tag count, duration, has audio,
                archive status, embedded metadata (`has exif`, `has icc profile`, `has embedded metadata`),
                `nearby <record id> [distance <bits>]` for perceptual-hash proximity, and so on) rather
                than a literal tag. The nearby distance is optional, defaults to 0 (an exact perceptual-hash
                match), and accepts values from 0 through 64 differing bits.
                Literal tags support a leading minus, for example `-character:name`. Namespace wildcards such
                as `character:*` and tag wildcards such as `character:na*` are supported. Tag wildcards
                support negation (`-character:na*`); negated namespace wildcards (`-character:*`) currently return 400.
                A star matches any sequence of characters; percent, underscore, and backslash are literal.
                Unknown text tags, namespaces, and unmatched wildcard expansions return 404.
                When this property is present, `tag_ids` is ignored, even when `tags` is empty.
            tag_ids:
              type: array
              items:
                $ref: ../../schemas/TagID.yaml
              description: Positive tag IDs, skipping text resolution. Ignored when tags is present.
            tag_domains:
              type: array
              items:
                $ref: ../../schemas/TagDomainID.yaml
              description: Restricts the search to these tag domains.
            display:
              type: string
              enum:
                - display
                - storage
              description: '`display` (default) resolves aliases and parents. Sibling resolution is stubbed out pending a rewrite. `storage` searches
                raw applied mappings only.'
            sort:
              type: object
              properties:
                by:
                  $ref: ../../schemas/SearchSortMethod.yaml
                  default: import_time
                order:
                  type: string
                  enum:
                    - asc
                    - desc
              description: Defaults to import time, descending. An omitted `by` keeps import-time sorting;
                an unknown or non-string `by` returns 400.
            limit:
              type: integer
              minimum: 0
            offset:
              type: integer
              minimum: 0
            debug:
              type: boolean
              default: false
              description: Include available execution-step diagnostics in stats. Labels, step counts, and timings may vary.
            return:
              type: array
              items:
                type: string
                enum:
                  - ids
                  - hashes
              description: Defaults to `["ids"]`.
  responses:
    '404':
      description: A text tag, namespace, or wildcard expansion could not be resolved. A known tag with no matching records instead produces a successful empty result.
      content:
        text/plain:
          schema:
            type: string
    '200':
      description: Search results
      content:
        application/json:
          schema:
            type: object
            required:
              - count
              - truncated
              - query_ms
            anyOf:
              - required:
                  - record_ids
              - required:
                  - hashes
            properties:
              record_ids:
                type: array
                description: Included when IDs are requested, including the default IDs-only response. May be empty.
                items:
                  type: integer
              hashes:
                type: array
                description: Included when hashes are requested. May be returned alongside record_ids, and may be empty.
                items:
                  type: string
              count:
                type: integer
              truncated:
                type: boolean
                description: A limit was applied and fully consumed, so more results may exist.
              query_ms:
                type: integer
              stats:
                type: array
                description: Included when debug is true and execution diagnostics are available. Row counts describe individual execution steps.
                items:
                  type: object
                  required:
                    - step
                    - rows
                    - inverted
                    - kind
                  properties:
                    step:
                      type: string
                    rows:
                      type: integer
                      format: int64
                    inverted:
                      type: boolean
                    kind:
                      type: string
                      enum:
                        - fetch
                        - fold
                        - page
                    micros:
                      type: integer
                      format: int64
                      minimum: 1
                      description: Elapsed microseconds; omitted when no positive timing was recorded.
    '400':
      description: Malformed request body, unknown sorting method, or non-string sort.by.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

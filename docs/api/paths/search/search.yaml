get:
  tags:
    - search
  summary: Searches for records using tag IDs
  description: >
    Returns record IDs whose active tag mappings satisfy the positive tag
    filter. With no tag IDs given, every record that has a file stored is
    returned. Defaults to file size ascending.
  parameters:
    - name: tag_ids
      in: query
      description: >
        Positive tag IDs to intersect. Repeat the parameter for multiple values
        (`?tag_ids=1&tag_ids=2`).
      required: false
      schema:
        type: array
        items:
          type: integer
    - name: tag_id
      in: query
      description: >
        Singular alias for `tag_ids`, honouring only the first tag. Preferred
        over `tag_ids` when both are given.
      required: false
      schema:
        type: array
        items:
          type: integer
    - name: tag_domains
      in: query
      description: Restricts the search to these tag domains.
      required: false
      schema:
        type: array
        items:
          type: integer
    - name: by
      in: query
      description: >
        Sort key. See the `sort.by` enum on `POST /search`. Defaults to
        `filesize`.
      required: false
      schema:
        type: string
    - name: order
      in: query
      description: Defaults to `asc`.
      required: false
      schema:
        type: string
        enum: [ asc, desc ]
  responses:
    200:
      description: Matching record IDs, empty when nothing matches
      content:
        application/json:
          schema:
            type: array
            items:
              type: integer
              description: record_id
    401:
      description: Missing or invalid API key

post:
  tags:
    - search
  summary: Full-featured record search
  description: >
    Search endpoint with negations, and system predicates.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            tags:
              type: array
              items:
                type: string
              description: >
                Tag text. A leading `-` negates the tag if present. A `system:`
                prefix is parsed as a system predicate (width, height, filesize,
                limit, tag count, duration, has audio, archive status,
                embedded metadata (`has exif`, `has icc profile`,
                `has embedded metadata`),
                `nearby <record id> [distance <bits>]` for perceptual-hash
                proximity, and so on) rather than a literal tag. The nearby
                distance is optional, defaults to 0 (an exact perceptual-hash
                match), and accepts values from 0 through 64 differing bits.
                Mutually exclusive with `tag_ids`.
            tag_ids:
              type: array
              items:
                type: integer
              description: Positive tag IDs, skipping text resolution.
            tag_domains:
              type: array
              items:
                type: integer
              description: Restricts the search to these tag domains.
            display:
              type: string
              enum: [ display, storage ]
              description: >
                `display` (default) resolves aliases, siblings and parents.
                `storage` searches raw applied mappings only.
            sort:
              type: object
              properties:
                by:
                  type: string
                  enum:
                    - filesize
                    - import_time
                    - record_time
                    - modified_time
                    - mime
                    - hash
                    - random
                    - duration
                    - framerate
                    - has_audio
                    - width
                    - height
                    - ratio
                    - num_pixels
                    - num_tags
                  description: >
                    `size` aliases `filesize` and `creation_time` aliases
                    `record_time`. Sorting by a field a record lacks drops that
                    record from the results rather than sorting it last: this
                    covers `modified_time` (unset until a record is modified),
                    `duration`, `framerate`, `has_audio`, `width`, `height`,
                    `ratio` and `num_pixels`. `num_tags` never drops anything,
                    since zero is a real count. `random` ignores `order` and
                    reshuffles on every call, so paging it is not stable.
                order:
                  type: string
                  enum: [ asc, desc ]
              description: Defaults to import time, descending.
            limit:
              type: integer
              minimum: 0
            offset:
              type: integer
              minimum: 0
            return:
              type: array
              items:
                type: string
                enum: [ ids, hashes ]
              description: Defaults to `["ids"]`.
  responses:
    200:
      description: Search results
      content:
        application/json:
          schema:
            type: object
            properties:
              record_ids:
                type: array
                items:
                  type: integer
              hashes:
                type: array
                items:
                  type: string
              count:
                type: integer
              truncated:
                type: boolean
                description: >
                  A limit was applied and fully consumed, so more results may
                  exist.
              query_ms:
                type: integer
    400:
      description: Malformed request body
    401:
      description: Missing or invalid API key

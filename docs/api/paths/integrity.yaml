get:
  tags:
    - maintenance
  summary: Runs an integrity check
  description: |-
    Reports the server's static file paths and every file under the static
    directory tree.
  responses:
    '200':
      description: Integrity check results
      content:
        application/json:
          schema:
            type: object
            properties:
              static:
                type: string
                description: Path to the static directory.
              static_exists:
                type: boolean
              files:
                type: array
                items:
                  type: string
                description: Regular files under the static parent directory.
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

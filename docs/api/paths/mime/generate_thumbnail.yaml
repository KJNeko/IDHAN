post:
  tags:
    - mime
  summary: Generates a thumbnail for an uploaded file
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema: { }
  responses:
    '200':
      description: Thumbnail bytes.
      content:
        image/webp:
          schema: { }
    '400':
      description: Missing body, or Content-Type is not `application/octet-stream`
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: No parser or thumbnailer for the detected MIME type, or generation failed
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: No thumbnailer is available.
      content:
        text/plain:
          schema:
            type: string

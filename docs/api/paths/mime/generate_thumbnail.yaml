post:
  tags:
    - mime
  summary: Generates a thumbnail for an uploaded file
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  responses:
    '200':
      description: Thumbnail image
      content:
        image/png:
          schema:
            type: string
            format: binary
    '400':
      description: Missing body, or Content-Type is not `application/octet-stream`
    '500':
      description: No parser or thumbnailer for the detected MIME type, or generation failed

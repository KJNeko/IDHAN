post:
  summary: Generate thumbnail of given file
  description: Upload a file to generate its thumbnail
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  responses:
    '200':
      description: Successfully generated thumbnail
      content:
        image/png:
          schema:
            type: string
            format: binary
    '400':
      description: Request body is missing or content type is not application/octet-stream
    '500':
      description: Internal error (no parser or thumbnailer available for the detected MIME type, or processing failed)

post:
  tags:
    - mime
  summary: Detects a file's MIME type and parses its metadata
  description: Detects MIME and invokes matching metadata modules. Send raw bytes with Content-Type application/octet-stream.
    Module failures appear within metadata_modules while detection can still succeed.
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema: { }
  responses:
    '200':
      description: Scan attempted. A `success` of false means the type could not be determined, and `error`
        replaces `mime`.
      content:
        application/json:
          schema:
            oneOf:
              - description: Type detected.
                type: object
                required:
                  - success
                  - mime
                  - metadata_modules
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  mime:
                    type: string
                    examples:
                      - image/png
                  metadata_modules:
                    type: array
                    description: One entry per module that matched the type.
                    items:
                      type: object
                      description: A successful module has name and extra. A failed module has name and
                        error; staging errors may contain only error.
                      properties:
                        name:
                          type: string
                        error:
                          type: string
                        count:
                          type: integer
                          format: int64
                          minimum: 0
                        uncompressed_size:
                          type: integer
                          format: int64
                          minimum: 0
                        extra: { }
                  mime_id:
                    type: integer
                  generic_mime_id:
                    type: integer
              - description: Detection failed, or no data was sent.
                type: object
                required:
                  - success
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
    '400':
      description: Content-Type is not application/octet-stream, or the body is empty.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
  parameters:
    - name: filename
      in: query
      required: false
      schema:
        type: string
      description: Optional filename hint for raw uploads.

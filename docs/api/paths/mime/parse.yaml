post:
  tags:
    - mime
  summary: Detects a file's MIME type and parses its metadata
  description: |
    Runs every metadata parser module that matches the detected type.

    Send raw bytes as `application/octet-stream`, or `multipart/form-data` with
    exactly one file part, whose filename is passed to the scanner as a hint.
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
      multipart/form-data:
        schema:
          type: object
          required:
            - file
          properties:
            file:
              type: string
              format: binary
              description: Exactly one file part.
  responses:
    '200':
      description: >
        Scan attempted. A `success` of false means the type could not be
        determined, and `error` replaces `mime`.
      content:
        application/json:
          schema:
            oneOf:
              - description: Type detected.
                type: object
                required:
                  - success
                  - mime
                  - metadata_modules
                properties:
                  success:
                    type: boolean
                    enum: [ true ]
                  mime:
                    type: string
                    example: image/png
                  metadata_modules:
                    type: array
                    description: One entry per module that matched the type.
                    items:
                      type: object
                      required:
                        - name
                        - extra
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                          description: Contained entries. Archives only.
                        uncompressed_size:
                          type: integer
                          description: Bytes uncompressed. Archives only.
                        extra:
                          type: object
                          description: Module-specific fields.
              - description: Detection failed, or no data was sent.
                type: object
                required:
                  - error
                properties:
                  success:
                    type: boolean
                    enum: [ false ]
                  error:
                    type: string
    '400':
      description: >
        Content-Type is neither `application/octet-stream` nor
        `multipart/form-data`, or a multipart request did not carry exactly one
        file part
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

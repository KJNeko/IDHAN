get:
  tags:
    - database
  summary: Returns database counts
  responses:
    '200':
      description: Returns database counts
      content:
        application/json:
          schema:
            type: object
            properties:
              records:
                type: integer
                format: int64
                minimum: 0
              tags:
                type: integer
                format: int64
                minimum: 0
              clusters:
                type: integer
                format: int64
                minimum: 0
              mappings:
                type: integer
                format: int64
                minimum: 0
              mappings_estimated:
                type: boolean
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

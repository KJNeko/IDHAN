get:
  tags:
    - maintenance
    - database
  summary: PostgreSQL storage sunburst data
  description: A tree for a sunburst chart. The root contains tables in the configured database schema
    with their storage sizes; table children describe index sizes.
  responses:
    '200':
      description: Sunburst tree of table and index sizes
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                examples:
                  - root
              children:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Table name.
                    value:
                      type: integer
                      description: Table size in bytes.
                    children:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Index name.
                          value:
                            type: integer
                            description: Index size in bytes.
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

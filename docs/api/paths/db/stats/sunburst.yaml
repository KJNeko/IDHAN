get:
  tags:
    - maintenance
    - database
  summary: PostgreSQL storage sunburst data
  description: |
    A tree shaped for a sunburst chart. The root's children are the public
    tables with their on-disk size; each table's children are its indexes.
  responses:
    200:
      description: Sunburst tree of table and index sizes
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: root
              children:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Table name.
                    value:
                      type: integer
                      description: Table size in bytes.
                    children:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Index name.
                          value:
                            type: integer
                            description: Index size in bytes.

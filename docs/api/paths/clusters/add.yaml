post:
  tags:
    - clusters
  summary: Creates a cluster
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/ClusterInfo.yaml'
        examples:
          readonly_existing:
            summary: Point at an existing directory (readonly, recommended for migrations)
            value:
              name: "My Media"
              path: "/mnt/media/idhan"
              readonly: true
          managed_new:
            summary: Create a new managed cluster IDHAN can write to
            value:
              name: "My Media"
              path: "/mnt/media/idhan"
              readonly: false
              ratio: 1
              size:
                limit: 0
  responses:
    200:
      description: The new cluster
      content:
        application/json:
          schema:
            $ref: '../../schemas/ClusterInfo.yaml'
    400:
      description: No JSON body, missing `name`, or a read-only cluster whose path does not exist
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              status:
                type: integer
    409:
      description: A cluster already uses that path
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              status:
                type: integer
    500:
      description: Directory could not be created, the write test failed, or the insert failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              status:
                type: integer

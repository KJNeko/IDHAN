delete:
  tags:
    - clusters
  summary: Deletes a filesystem cluster. The cluster MUST be empty before deletion.
  parameters:
    - name: cluster_id
      in: path
      required: true
      schema:
        type: integer
      description: The ID of the cluster to remove.
  responses:
    200:
      description: The cluster was successfully removed.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 200
    404:
      description: No cluster with the given cluster_id exists.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 404
    409:
      description: The cluster cannot be deleted because it still contains files that have not been migrated.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 409

delete:
  tags:
    - clusters
  summary: Deletes a cluster
  description: Removes the cluster registration and marks records assigned to it as no longer stored.
    Files and directories under the cluster path are left untouched.
  parameters:
    - name: cluster_id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Cluster registration removed; files remain on disk.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
    '404':
      description: Cluster not found
      content:
        text/plain:
          schema:
            type: string
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

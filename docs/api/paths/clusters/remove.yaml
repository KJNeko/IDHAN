delete:
  tags:
    - clusters
  summary: Deletes a cluster
  description: >-
    Removes the cluster registration and marks records assigned to it as no longer stored. Files and
    directories under the cluster path are left untouched.
  parameters:
    - name: cluster_id
      in: path
      required: true
      schema:
        type: integer
  responses:
    200:
      description: Cluster removed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 200
    404:
      description: Cluster not found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 404

delete:
  tags:
    - clusters
  summary: Deletes a cluster
  description: The cluster must be empty first.
  parameters:
    - name: cluster_id
      in: path
      required: true
      schema:
        type: integer
  responses:
    200:
      description: Cluster removed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 200
    404:
      description: Cluster not found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 404
    409:
      description: Cluster still holds files
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 409

get:
  tags:
    - clusters
  summary: Returns all clusters with their info
  responses:
    '200':
      description: Every registered cluster
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../schemas/ClusterInfo.yaml
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

get:
  tags:
    - clusters
  summary: Returns information about a cluster
  parameters:
    - in: path
      name: cluster_id
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Cluster info
      content:
        application/json:
          schema:
            $ref: ../../schemas/ClusterInfo.yaml
    '404':
      description: Cluster not found
      content:
        text/plain:
          schema:
            type: string
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

patch:
  tags:
    - clusters
  summary: Modifies a cluster
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/ClusterUpdate.yaml
  parameters:
    - in: path
      name: cluster_id
      required: true
      schema:
        type: integer
  responses:
    '503':
      description: Cluster identity could not be verified; configuration was not modified.
      content:
        text/plain:
          schema:
            type: string
    '200':
      description: The updated cluster
      content:
        application/json:
          schema:
            $ref: ../../schemas/ClusterInfo.yaml
    '404':
      description: Cluster not found
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal failure.
      content:
        text/plain:
          schema:
            type: string
    '400':
      description: Missing or invalid JSON, invalid cluster ID, ratio, or limit.
      content:
        text/plain:
          schema:
            type: string
    '409':
      description: >-
        Another cluster already uses the new name, including a conflict with a
        concurrent rename. Names use exact, case-sensitive comparison. Keeping
        this cluster's own name is allowed. Path changes remain ignored.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string

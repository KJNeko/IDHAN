patch:
  tags:
    - clusters
  summary: Modifies a cluster
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/ClusterInfo.yaml'
  parameters:
    - in: path
      name: cluster_id
      required: true
      schema:
        type: integer
  responses:
    200:
      description: The updated cluster
      content:
        application/json:
          schema:
            $ref: '../../schemas/ClusterInfo.yaml'
    404:
      description: Cluster not found
    500:
      description: Missing or invalid JSON body

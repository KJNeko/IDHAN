get:
  tags:
    - clusters
  summary: Scans a cluster for files
  description: >
    Enqueues a scan job and returns its ID immediately. The scan verifies
    hashes, resolves cluster assignments, optionally detects MIME types and
    extracts metadata, and can adopt orphaned files.
  parameters:
    - name: cluster_id
      in: path
      required: true
      schema:
        type: integer
    - name: verify_hash
      in: query
      required: false
      description: >
        Hash each file to confirm it matches its filename. If false, the
        filename is trusted as the hash.
      schema:
        type: boolean
        default: false
    - name: readonly
      in: query
      required: false
      description: >
        Treat the cluster as read-only whatever its stored flag says. Nothing is
        moved or renamed.
      schema:
        type: boolean
        default: false
    - name: scan_mime
      in: query
      required: false
      description: Detect MIME for files not scanned before.
      schema:
        type: boolean
        default: true
    - name: rescan_mime
      in: query
      required: false
      description: Detect MIME again for every file.
      schema:
        type: boolean
        default: false
    - name: scan_metadata
      in: query
      required: false
      description: Parse metadata for files not parsed before.
      schema:
        type: boolean
        default: true
    - name: rescan_metadata
      in: query
      required: false
      description: Parse metadata again for every file.
      schema:
        type: boolean
        default: true
    - name: stop_on_fail
      in: query
      required: false
      description: Stop at the first failure instead of continuing past it.
      schema:
        type: boolean
        default: false
    - name: adopt_orphans
      in: query
      required: false
      description: >
        Create records for files on disk that have none. Forces `verify_hash`
        and `scan_mime` on.
      schema:
        type: boolean
        default: false
    - name: remove_missing_files
      in: query
      required: false
      description: >
        Track unexpectedly absent expected files in `missing_files`. The marker
        is cleared the next time the file is stored.
      schema:
        type: boolean
        default: false
    - name: fix_extensions
      in: query
      required: false
      description: >
        Rename files whose extension does not match their detected MIME type.
        Ignored if the cluster is read-only.
      schema:
        type: boolean
        default: false
  responses:
    200:
      description: Job enqueued
      content:
        application/json:
          schema:
            type: object
            properties:
              job_id:
                type: integer
                format: uint64
            required:
              - job_id
          example:
            job_id: 42
    400:
      description: Cluster not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    500:
      description: >
        A file failed the scan: hash mismatch on a read-only cluster, zero-size
        file, an orphan with `adopt_orphans` off, a MIME or metadata parse
        failure, or an unreadable folder.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

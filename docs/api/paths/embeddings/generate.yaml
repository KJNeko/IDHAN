post:
  tags:
    - embeddings
  summary: Starts an embedding backfill job
  responses:
    '200':
      description: Starts an embedding backfill job
      content:
        application/json:
          schema:
            type: object
            properties:
              job_id:
                type: integer
                format: int64
                minimum: 0
              model_id:
                type: integer
                format: int32
                minimum: 1
              status:
                type: string
                const: dispatched
            required:
              - job_id
              - model_id
              - status
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: Requested resource is unavailable.
      content:
        text/plain:
          schema:
            type: string
    '409':
      description: The request conflicts with existing state.
      content:
        text/plain:
          schema:
            type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            model_name:
              type: string
          required:
            - model_name

post:
  tags:
    - embeddings
  summary: Searches using a weighted embedding query
  responses:
    '200':
      description: Searches using a weighted embedding query
      content:
        application/json:
          schema:
            type: object
            properties:
              record_ids:
                type: array
                items:
                  $ref: ../../schemas/RecordID.yaml
              distances:
                type: array
                items:
                  type: number
              query_ms:
                type: integer
                format: int64
                minimum: 0
            required:
              - record_ids
              - distances
              - query_ms
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: Requested resource is unavailable.
      content:
        text/plain:
          schema:
            type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            model_name:
              type: string
            terms:
              type: array
              items:
                $ref: ../../schemas/EmbeddingTerm.yaml
              minItems: 1
            limit:
              type: integer
              default: 200
              description: Positive values are capped at 1000; nonpositive values use the default.
            ef_search:
              type: integer
              default: 100
              description: Positive values are capped at 1000 and raised to at least limit; nonpositive
                values use the default.
          required:
            - model_name
            - terms

post:
  tags:
    - records
  summary: Imports a file
  description: |
    Always 200 when the body is accepted. `status` carries the outcome:
    1 imported, 2 already present, 3 previously deleted, 4 MIME unknown.
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  responses:
    '200':
      description: Import processed
      content:
        application/json:
          schema:
            type: object
            required: [ status ]
            properties:
              status:
                type: integer
                enum: [ 1, 2, 3, 4 ]
              record_id:
                type: integer
              record:
                type: object
                properties:
                  id:
                    type: integer
                  creation_time:
                    type: integer
                  creation_time_human:
                    type: string
                  deleted_time:
                    type: integer
                    description: Present only when `status` is 3.
                  deleted_time_human:
                    type: string
                    description: Present only when `status` is 3.
              file:
                type: object
                properties:
                  import_time:
                    type: integer
                  import_time_human:
                    type: string
              reason:
                type: string
                description: Present only when `status` is 4.
          examples:
            imported:
              summary: New file imported (status=1)
              value:
                status: 1
                record_id: 43
                record:
                  id: 43
                  creation_time: 1749642039
                  creation_time_human: "2025-06-11 11:40:38.572907"
                file:
                  import_time: 1749642232
                  import_time_human: "2025-06-11 11:43:51.627481"
            already_exists:
              summary: File already exists (status=2)
              value:
                status: 2
                record_id: 43
                record:
                  id: 43
                  creation_time: 1749642039
                  creation_time_human: "2025-06-11 11:40:38.572907"
                file:
                  import_time: 1749642232
                  import_time_human: "2025-06-11 11:43:51.627481"
            previously_deleted:
              summary: File was previously deleted (status=3)
              value:
                status: 3
                record_id: 43
                record:
                  id: 43
                  creation_time: 1749642039
                  creation_time_human: "2025-06-11 11:40:38.572907"
                  deleted_time: 1749642300
                  deleted_time_human: "2025-06-11 11:45:00.000000"
                file:
                  import_time: 1749642232
                  import_time_human: "2025-06-11 11:43:51.627481"
            unknown_mime:
              summary: MIME type unknown (status=4)
              value:
                status: 4
                reason: "unknown mime"
    '400':
      description: Content-Type is not `application/octet-stream`

post:
  tags:
    - records
  summary: Imports a given file.
  description: |
    Imports a file into IDHAN. The `status` field in the response discriminates the outcome:
    - `1` — new file imported successfully
    - `2` — file already exists in IDHAN
    - `3` — file was previously deleted
    - `4` — MIME type could not be determined (unknown mime)
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  responses:
    '200':
      description: Import processed (check `status` field for outcome)
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: integer
                enum: [1, 2, 3, 4]
                description: |
                  1=imported, 2=already exists, 3=previously deleted, 4=unknown mime
              record_id:
                type: integer
              record:
                type: object
                properties:
                  id:
                    type: integer
                  creation_time:
                    type: integer
                  creation_time_human:
                    type: string
                  deleted_time:
                    type: integer
                    description: Only present when status=3
                  deleted_time_human:
                    type: string
                    description: Only present when status=3
              file:
                type: object
                properties:
                  import_time:
                    type: integer
                  import_time_human:
                    type: string
              reason:
                type: string
                description: Only present when status=4 (e.g. "unknown mime")
          examples:
            imported:
              summary: New file imported (status=1)
              value:
                status: 1
                record_id: 43
                record:
                  id: 43
                  creation_time: 1749642039
                  creation_time_human: "2025-06-11 11:40:38.572907"
                file:
                  import_time: 1749642232
                  import_time_human: "2025-06-11 11:43:51.627481"
            already_exists:
              summary: File already exists (status=2)
              value:
                status: 2
                record_id: 43
                record:
                  id: 43
                  creation_time: 1749642039
                  creation_time_human: "2025-06-11 11:40:38.572907"
                file:
                  import_time: 1749642232
                  import_time_human: "2025-06-11 11:43:51.627481"
            previously_deleted:
              summary: File was previously deleted (status=3)
              value:
                status: 3
                record_id: 43
                record:
                  id: 43
                  creation_time: 1749642039
                  creation_time_human: "2025-06-11 11:40:38.572907"
                  deleted_time: 1749642300
                  deleted_time_human: "2025-06-11 11:45:00.000000"
                file:
                  import_time: 1749642232
                  import_time_human: "2025-06-11 11:43:51.627481"
            unknown_mime:
              summary: MIME type unknown (status=4)
              value:
                status: 4
                reason: "unknown mime"
    '400':
      description: Content-Type is not application/octet-stream

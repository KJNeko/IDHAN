get:
  tags:
    - mime
  summary: Lists known MIME identifiers
  responses:
    '200':
      description: Lists known MIME identifiers
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
  description: JSON member names are numeric MIME identifiers; values are MIME strings.

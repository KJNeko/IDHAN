get:
  tags:
    - downloader
  summary: Streams downloader runtime diagnostics
  description: |
    Authenticated SSE carrying the same diagnostic state as GET /downloader/debug.
    The initial snapshot contains all live sessions, retained events, lanes, and module queues.
    Each update replaces sessions, lanes, and modules while carrying only session events
    after the previous event sequence on this connection. events_dropped reports
    missed events if a session's bounded history overtakes that cursor.

    Session diagnostic publications, session changes/removals, and lane changes
    trigger notifications, as do module worker starts/stops and changed heartbeat
    activity reports. Concurrent changes coalesce before rendering. Idle
    streams only send keepalive comments; rendering is not polled on a timer and
    producers perform no diagnostic database reads.

    Reconnects start with a fresh snapshot and new event cursors. Replace local
    state on snapshot; merge event histories by sequence on update. A session
    absent from the next state has been removed. There is no replay cursor or
    Last-Event-ID support. Shutdown closes the stream.
  responses:
    '200':
      description: Named snapshot, update and shutdown events with heartbeat comments.
      content:
        text/event-stream:
          schema:
            type: string
          example: |+
            event: snapshot
            data: {"sessions":[],"lanes":[],"modules":[]}

    '401':
      description: Authentication required or API key not recognized.

get:
  tags:
    - downloader
  summary: Fetches the downloader secrets
  description: Returns every secret currently exposed to downloader scripts through `idhan.secret()`.
  responses:
    200:
      description: The current secret keys and values.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string

post:
  tags:
    - downloader
  summary: Sets downloader secrets
  description: |
    Adds or replaces secrets exposed to downloader scripts through `idhan.secret()`.
    Each JSON member name is the secret key and its string is the secret value.
    Values are stored in the database and survive a server restart.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties:
            type: string
        example:
          gelbooru.apiKey: secret-value
          gelbooru.userID: "12345"
  responses:
    200:
      description: The complete current set of secret keys and values.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
    400:
      description: The body is not an object or one of its values is not a string.

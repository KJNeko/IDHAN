get:
  tags:
    - jobs
  summary: Returns the status of a job
  description: |
    Polling a completed job makes it eligible for cleanup, so it may be dropped
    from the runtime afterwards.
  parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    200:
      description: Job status
      content:
        application/json:
          schema:
            type: object
            properties:
              job_id:
                type: integer
              job_name:
                type: string
              status:
                type: string
                enum: [ running, completed, failed, not_found ]
              completed:
                type: boolean
              start_time:
                type: integer
                description: Unix timestamp.
              error:
                type: string
                description: Present only when `status` is `failed`.
              response:
                description: >
                  Operation-specific result, present when a job supplies one.
                  Metadata rescan jobs return `RescanMetadataResult`.
                anyOf:
                  - $ref: '../../schemas/RescanMetadataResult.yaml'
                  - type: object
                    additionalProperties: true
                  - type: string
          examples:
            rescan_metadata_completed:
              summary: Completed metadata rescan
              value:
                job_id: 123
                job_name: rescanMetadata
                status: completed
                completed: true
                start_time: 1787756400
                response:
                  scanned_count: 42
                  failed_count: 1
    404:
      description: Job not found

get:
  tags:
    - jobs
  summary: Returns the status of a job
  description: Poll the job status. Polling a completed job marks it eligible for cleanup. Results are
    also retained for at most one hour after completion. Unknown IDs return 404. Per-file scan failures
    may be reported in response even when status is completed.
    The optional response accepts any JSON value. Known cluster-scan and metadata-rescan
    producer contracts are documented separately as ClusterScanResult and RescanMetadataResult;
    job_name is descriptive text and does not discriminate the result type.
  parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Job status
      content:
        application/json:
          schema:
            $ref: ../../schemas/JobStatus.yaml
    '404':
      description: Job not found
      content:
        text/plain:
          schema:
            type: string
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

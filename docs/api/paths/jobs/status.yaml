get:
  tags:
    - jobs
  summary: Returns the status of a job
  description: |
    Polling a completed job makes it eligible for cleanup, so it may be dropped
    from the runtime afterwards.
  parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    200:
      description: Job status
      content:
        application/json:
          schema:
            type: object
            properties:
              job_id:
                type: integer
              job_name:
                type: string
              status:
                type: string
                enum: [ running, completed, failed, not_found ]
              completed:
                type: boolean
              start_time:
                type: integer
                description: Unix timestamp.
              error:
                type: string
                description: Present only when `status` is `failed`.
              response:
                description: Present only when `status` is `completed`.
    404:
      description: Job not found

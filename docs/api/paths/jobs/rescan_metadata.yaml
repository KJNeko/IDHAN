post:
  tags:
    - jobs
    - maintenance
  summary: Rescans metadata for records
  description: |
    Dispatches a job that re-runs the metadata parser and returns its `job_id`
    immediately; poll `/jobs/{job_id}/status` for the result.

    With no body, or a body without `record_ids`, every record that has file
    info is rescanned. With `record_ids`, only those records are, and every id
    must exist.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            record_ids:
              type: array
              minItems: 1
              items:
                $ref: '../../schemas/RecordID.yaml'
              description: Records to rescan. Omit to rescan everything.
  responses:
    200:
      description: Rescan job dispatched
      content:
        application/json:
          schema:
            type: object
            properties:
              job_id:
                type: integer
              status:
                type: string
                example: dispatched
              record_count:
                type: integer
                description: Records the job was scoped to, or 0 when it rescans everything.
    400:
      description: record_ids was present but not a non-empty array of unsigned integers
    404:
      description: One of the listed records does not exist

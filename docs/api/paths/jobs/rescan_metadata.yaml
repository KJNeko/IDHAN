post:
  tags:
    - jobs
    - maintenance
  summary: Rescans metadata for records
  description: Enqueues metadata parsing and returns only job_id. Supply a records array to select IDs.
    An omitted or empty array rescans every record with file_info. IDs must be positive and fit RecordID;
    record existence is not checked before enqueueing. Parse failures are reported by the job.
    Successful metadata writes commit atomically per record.
    When the job publishes a result, its response follows RescanMetadataResult
    (scanned_count, failed_count, and per-record failures). Per-record failures
    do not by themselves make the job status failed.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            records:
              type: array
              items:
                $ref: ../../schemas/RecordID.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../../schemas/JobQueued.yaml
    '400':
      description: Malformed JSON or a non-integral, nonpositive, or out-of-range item in records.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

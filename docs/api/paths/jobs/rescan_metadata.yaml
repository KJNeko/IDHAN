post:
  tags:
    - jobs
    - maintenance
  summary: Rescan metadata for all records
  description: |
    Queues a metadata rescan for every record that has file info. Iterates all
    records in `file_info` and re-runs the metadata parser for each. Returns an
    empty JSON object when the scan is complete.
  responses:
    200:
      description: Rescan completed
      content:
        application/json:
          schema:
            type: object

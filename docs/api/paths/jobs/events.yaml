get:
  tags:
    - jobs
  summary: Streams job status and progress
  description: |
    Opens an authenticated SSE subscription without marking completed jobs for cleanup.
    The initial `snapshot` contains `{"jobs":[...]}` using the same JobStatus objects
    as GET /jobs/status. Each `update` is a complete JobStatus replacement, including
    progress and any available response. Cleanup sends `{"job_id":123,"removed":true}`.

    Job creation, start, progress, response, and completion trigger updates. Rapid
    changes are coalesced over 100 milliseconds; intermediate stages may be skipped.
    Snapshots contain the latest advertised states; changes still pending publication
    arrive as subsequent updates. Idle jobs generate no progress traffic. Heartbeat
    comments keep the connection alive.

    Reconnect with a new subscription and replace local state with its snapshot.
    There is no replay cursor or Last-Event-ID support. Jobs are process-local.
    A shutdown event closes the stream when the server stops.
  responses:
    '200':
      description: Named snapshot, update and shutdown events with heartbeat comments.
      content:
        text/event-stream:
          schema:
            type: string
          example: |+
            event: snapshot
            data: {"jobs":[]}

            event: update
            data: {"job_id":123,"job_name":"Cluster scan","status":"running","completed":false,"continuous":false,"progress":{"kind":"cluster_scan","phase":"scanning_files"}}

            event: update
            data: {"job_id":123,"removed":true}

    '401':
      description: Authentication required or API key not recognized.

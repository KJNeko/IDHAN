get:
  tags:
    - jobs
  summary: Returns the status of many jobs
  description: Returns all retained jobs, including completed jobs. The request body is ignored. cleanup=true
    marks completed jobs eligible for cleanup after this response.
  parameters:
    - name: cleanup
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Drop completed jobs after returning them.
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              jobs:
                type: array
                items:
                  $ref: ../../schemas/JobStatus.yaml
            required:
              - jobs
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

get:
  tags:
    - jobs
  summary: Returns the status of many jobs
  description: |
    All running jobs, or only those named by `job_ids` in the body.
  parameters:
    - name: cleanup
      in: query
      required: false
      schema:
        type: boolean
      description: Drop completed jobs after returning them.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            job_ids:
              type: array
              items:
                type: integer
                format: int64
          description: Omit for every job.
        examples:
          specific_jobs:
            summary: Query specific jobs
            value:
              job_ids: [ 1, 2, 3 ]
  responses:
    200:
      description: Job statuses
      content:
        application/json:
          schema:
            type: object
            properties:
              jobs:
                type: array
                items:
                  type: object

post:
  tags:
    - public
  summary: Generates the initial API key
  description: |
    Only works while the server has no keys; later calls return an empty body.
    Send the returned key as the `IDHAN-Api-Key` header on authenticated
    endpoints.
  security: [ ]
  responses:
    200:
      description: The generated key, or an empty body if one already exists
      content:
        application/json:
          schema:
            type: object
            properties:
              key:
                type: string
                description: SHA-256 hex. Present only on the first call.
                example: "a3f0c1d2e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1"

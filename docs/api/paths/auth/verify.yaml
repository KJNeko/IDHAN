get:
  tags:
    - auth
  summary: Verifies the supplied API key
  responses:
    '200':
      description: Verifies the supplied API key
      content:
        application/json:
          schema:
            type: object
            properties:
              authenticated:
                type: boolean
                const: true
            required:
              - authenticated
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string

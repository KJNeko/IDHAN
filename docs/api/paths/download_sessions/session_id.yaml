get:
  tags:
    - downloader
  summary: Fetches a download session
  responses:
    '200':
      description: Fetches a download session
      content:
        application/json:
          schema:
            $ref: ../../schemas/DownloadSession.yaml
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: Requested resource is unavailable.
      content:
        text/plain:
          schema:
            type: string
  parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
delete:
  tags:
    - downloader
  summary: Deletes a session and cancels its work
  responses:
    '200':
      description: Deletes a session and cancels its work
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted:
                type: boolean
                const: true
            required:
              - deleted
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: Requested resource is unavailable.
      content:
        text/plain:
          schema:
            type: string
  parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

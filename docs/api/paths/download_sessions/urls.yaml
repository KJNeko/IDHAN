post:
  tags:
    - downloader
  summary: Creates a session and queues its first URL
  responses:
    '201':
      description: Creates a session and queues its first URL
      content:
        application/json:
          schema:
            type: object
            properties:
              session:
                $ref: ../../schemas/DownloadSession.yaml
              url:
                $ref: ../../schemas/DownloadUrlNode.yaml
            required:
              - session
              - url
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '409':
      description: The request conflicts with existing state.
      content:
        text/plain:
          schema:
            type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            url:
              type: string
              minLength: 1
              maxLength: 8192
            name:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - url
  description: If name is omitted, chooses an available name based on the URL.

get:
  tags:
    - downloader
  summary: Subscribes to rate-limit updates
  responses:
    '200':
      description: Named SSE state notifications with JSON data, heartbeat comments, and an empty shutdown
        event.
      content:
        text/event-stream:
          itemSchema:
            $ref: ../../schemas/RateLimitEvent.yaml
          examples:
            stream:
              summary: Illustrative wire frames, each terminated by a blank line
              serializedValue: |+
                retry: 3000

                event: snapshot
                timestamp: 1792440000
                data: {"limits":[{"scheduling_key":"example.com","group":"","requests":2,"seconds":1,"throttled":true,"effective_interval_ms":500,"remaining_ms":250,"consecutive_limits":0,"backed_off":false,"in_flight":1,"queued":3,"shards":1,"bytes_per_second":0,"download_bytes_per_second":0,"active":true}]}

                event: update
                timestamp: 1792440001
                data: {"scheduling_key":"example.com","group":"","requests":2,"seconds":1,"throttled":true,"effective_interval_ms":500,"remaining_ms":250,"consecutive_limits":0,"backed_off":false,"in_flight":1,"queued":3,"shards":1,"bytes_per_second":0,"download_bytes_per_second":0,"active":true}

                : keepalive

                event: shutdown
                timestamp: 1792440010
                data:

    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
  description: |
    Subscribes to the latest known state of downloader rate-limit lanes.

    `snapshot` data is `{"limits":[...]}` with complete lane-state objects sorted
    by `scheduling_key`; an empty list is valid. `update` data is one complete lane
    state, which replaces the locally cached entry with the same `scheduling_key`.
    An inactive lane is represented by `active: false`, rather than a removal event.
    The opening snapshot contains the latest states advertised to the event hub,
    not a new synchronous read of every lane. Remaining delays are reduced by the
    elapsed time since each stored update and clamped to zero.

    The SSE fields `scheduling_key` and `consecutive_limits` correspond to REST
    `lane` and `consecutive_failures`. The stream additionally emits
    `bytes_per_second`. Do not decode these events with the GET /rate_limits REST
    schema. All lane fields are present, `group` is an empty string when unset,
    delays are rounded-up milliseconds, and `seconds` is an integer rate window.
    `bytes_per_second` is the configured per-transfer receive limit; zero disables
    that bandwidth limit. `download_bytes_per_second` reports received body bytes
    over the last second across all lane transfers, sampled in 100 ms buckets. It
    includes decoded error and redirect bodies and excludes headers. Active lanes
    publish updates once per second, including zero speed after traffic stops.
    Counter values are unsigned JSON integers.

    Both streams begin with `retry: 3000` (a reconnect delay of 3000 milliseconds).
    They send named `snapshot`, `update`, and `shutdown` events. Subscribe with
    `addEventListener` for those names; `onmessage` does not receive them. Snapshot
    and nonempty update `data` values are JSON text. Shutdown has an empty `data`
    string and ends the stream; do not JSON-decode empty data. Comments such as
    `: keepalive` keep idle connections open without dispatching an event. The
    server checks idle subscriptions for heartbeats approximately every 10 seconds;
    this is not a delivery-time guarantee.

    Every application frame includes a custom `timestamp` line containing integer
    Unix epoch seconds captured when the event is queued. Standard SSE parsers,
    including browser EventSource, ignore that field; it is not in event.data and
    is not exposed as a MessageEvent property. The item schema describes parsed
    SSE events, not every line of the wire format. Retry-only blocks and comments
    do not dispatch application events.

    Pending updates for the same entity may coalesce. There are no SSE `id` fields
    or replay cursor, and `Last-Event-ID` does not resume missed updates. On each
    reconnect, use the new opening snapshot to rebuild local state. Snapshots and
    updates are not an atomic transaction, so refetch when state is uncertain.
    Disconnecting releases the subscription. Clients may reconnect automatically
    after shutdown or a dropped connection; call EventSource.close() to stop.

post:
  tags:
    - maintenance
  summary: Purges every thumbnail
  description: |
    Deletes all thumbnail files and prunes the empty directories left behind.
  responses:
    200:
      description: Purge result
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              deleted_count:
                type: integer
              failed_count:
                type: integer
              message:
                type: string
          examples:
            success:
              value:
                success: true
                deleted_count: 1042
                failed_count: 0
                message: "Thumbnails purged successfully"
            no_directory:
              value:
                success: true
                deleted_count: 0
                message: "Thumbnails directory does not exist"
    500:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string

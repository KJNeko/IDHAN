post:
  tags:
    - maintenance
  summary: Purges recognized cached thumbnails
  description: >-
    Deletes only regular files named <64 lowercase hexadecimal hash>.<size>.webp in immediate
    t00–tff bucket directories. The hash prefix must match the bucket and size must be a canonical
    decimal integer from 1 through 4096. Bucket directories are retained. Unrecognized files,
    temporary files, nested directories, and symlinks are left alone; symlinks are never followed.
    A missing cache root succeeds with zero deletions. Concurrent generation can create new cache entries during a purge.
  responses:
    '200':
      description: Purge result
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              deleted_count:
                type: integer
                minimum: 0
                description: Number of recognized regular thumbnail cache files actually deleted.
              message:
                type: string
            required:
              - success
              - deleted_count
              - message
          examples:
            success:
              value:
                success: true
                deleted_count: 1042
                message: Thumbnails purged successfully
    '500':
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string

get:
  tags:
    - records
    - urls
  summary: Returns a record's URLs
  parameters:
    - name: record_id
      in: path
      required: true
      schema:
        $ref: ../../../schemas/RecordID.yaml
  responses:
    '200':
      description: Array of URL strings
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
              format: uri
          examples:
            urls:
              summary: List of source URLs
              value:
                - https://example.com/image.jpg
                - https://other.com/img.png
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: Record does not exist or is unavailable.
      content:
        text/plain:
          schema:
            type: string

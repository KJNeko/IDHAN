post:
  tags:
    - records
    - urls
  summary: Removes one or more URLs from a record
  parameters:
    - name: record_id
      in: path
      required: true
      schema:
        $ref: '../../../schemas/RecordID.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - urls
          properties:
            urls:
              type: array
              items:
                type: string
                format: uri
        examples:
          remove_urls:
            summary: Remove source URLs
            value:
              urls:
                - "https://example.com/image.jpg"
  responses:
    200:
      description: URLs removed successfully
    400:
      description: Missing or invalid request body

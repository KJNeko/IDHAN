post:
  tags:
    - records
    - urls
  summary: Removes one or more URLs from a record
  parameters:
    - name: record_id
      in: path
      required: true
      schema:
        $ref: ../../../schemas/RecordID.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - urls
          properties:
            urls:
              type: array
              items:
                type: string
                format: uri
        examples:
          remove_urls:
            summary: Remove source URLs
            value:
              urls:
                - https://example.com/image.jpg
  responses:
    '200':
      description: URLs unlinked. Empty response body (Content-Type application/json).
    '400':
      description: Missing or invalid body
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: Record does not exist or is unavailable.
      content:
        text/plain:
          schema:
            type: string

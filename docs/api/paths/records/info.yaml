get:
  tags:
    - records
  summary: Returns information about a record
  description: |
    The SHA-256 is always present. MIME type, size, extension, and type-specific
    fields appear only if the file has been parsed.
  parameters:
    - $ref: '../../parameters/record_id.yaml'
  responses:
    200:
      description: Record information
      content:
        application/json:
          schema:
            $ref: '../../schemas/RecordInfo.yaml'
          examples:
            parsed_image:
              summary: Parsed JPEG image record
              value:
                record_id: 42
                hashes:
                  sha256: "a3f0c1d2e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1"
                size: 1048576
                mime: "image/jpeg"
                extension: "jpg"
                extra: { }
                width: 1920
                height: 1080
                channels: 3
            parsed_video:
              summary: Parsed video record
              value:
                record_id: 99
                hashes:
                  sha256: "c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3"
                size: 52428800
                mime: "video/mp4"
                extension: "mp4"
                extra: { }
                width: 1280
                height: 720
                duration: 120.5
                bitrate: 4000000
                has_audio: true
            unparsed:
              summary: Record that has not been scanned yet
              value:
                record_id: 7
                hashes:
                  sha256: "b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2"
    400:
      description: Record not found
    500:
      description: Internal error

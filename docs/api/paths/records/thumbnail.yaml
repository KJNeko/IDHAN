get:
  tags:
    - records
  summary: Returns a record's thumbnail
  description: >
    PNG thumbnail. If no cached copy exists one is generated by the first
    thumbnailer module that handles the record's MIME type, then cached to disk.
  parameters:
    - $ref: '../../parameters/record_id.yaml'
    - name: regenerate
      in: query
      required: false
      description: Regenerate even if a cached copy exists.
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: Thumbnail image
      content:
        image/png:
          schema:
            type: string
            format: binary
    '400':
      description: >
        Record does not exist, has no file info, or has no thumbnailer for its
        MIME type
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

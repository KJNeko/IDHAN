get:
  tags:
    - records
  summary: Returns a record's thumbnail
  description: Returns a WebP thumbnail. Missing cache entries are generated by a module and cached by
    record hash and requested size. Cached delivery uses the shared file response, including Range and
    conditional requests. When generation cannot be cached, delivery is a full 200 response with
    Cache-Control no-store and does not use the cached range or validator handling.
  parameters:
    - $ref: ../../parameters/record_id.yaml
    - name: regenerate
      in: query
      required: false
      description: Regenerate even if a cached copy exists.
      schema:
        type: boolean
        default: false
    - name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 4096
        default: 256
    - name: Range
      in: header
      required: false
      description: 'Cached delivery only. One bytes=N-M or bytes=N- range; suffix and multiple ranges are ignored.'
      schema:
        type: string
        examples:
          - bytes=0-1023
    - name: If-Match
      in: header
      required: false
      schema:
        type: string
    - name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    - name: If-Modified-Since
      in: header
      required: false
      schema:
        type: string
    - name: If-Unmodified-Since
      in: header
      required: false
      schema:
        type: string
    - name: If-Range
      in: header
      required: false
      description: Cached delivery applies the range only when this is absent or matches the entity tag.
      schema:
        type: string
  responses:
    '503':
      description: The original file was needed but its cluster identity could not be verified. A cached thumbnail can still be served.
      content:
        text/plain:
          schema:
            type: string
    '200':
      description: WebP thumbnail bytes.
      headers:
        Cache-Control:
          schema:
            type: string
          description: Private cache policy for cached delivery; no-store for uncached generation.
        ETag:
          schema:
            type: string
          description: Cached delivery only; quoted tag derived from thumbnail modification time and size.
        Last-Modified:
          schema:
            type: string
          description: Cached delivery only; thumbnail file modification time as an HTTP date.
        Accept-Ranges:
          schema:
            type: string
          description: Cached delivery only; bytes.
        Content-Disposition:
          schema:
            type: string
          description: Cached delivery only; inline with the record hash and .webp filename.
      content:
        image/webp:
          schema: { }
    '206':
      description: Partial cached thumbnail bytes.
      headers:
        Content-Range:
          schema:
            type: string
          description: Returned byte interval and full thumbnail size.
        ETag:
          schema:
            type: string
        Last-Modified:
          schema:
            type: string
        Accept-Ranges:
          schema:
            type: string
          description: bytes
        Cache-Control:
          schema:
            type: string
        Content-Disposition:
          schema:
            type: string
      content:
        image/webp:
          schema: { }
    '304':
      description: Cached thumbnail not modified; no body. Cached validators and cache headers are returned.
      headers:
        ETag:
          schema:
            type: string
        Last-Modified:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
        Accept-Ranges:
          schema:
            type: string
        Content-Disposition:
          schema:
            type: string
    '412':
      description: Cached thumbnail precondition failed; no body. Cached validators and cache headers are returned.
      headers:
        ETag:
          schema:
            type: string
        Last-Modified:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
        Accept-Ranges:
          schema:
            type: string
        Content-Disposition:
          schema:
            type: string
    '416':
      description: Cached thumbnail byte range is unsatisfiable; no body.
      headers:
        ETag:
          schema:
            type: string
        Last-Modified:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
        Accept-Ranges:
          schema:
            type: string
        Content-Disposition:
          schema:
            type: string
        Content-Range:
          schema:
            type: string
          description: bytes */<full thumbnail size>
    '400':
      description: Invalid size or regenerate parameter, or no thumbnailer is available for the MIME type.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '404':
      description: Record or file info does not exist.
      content:
        text/plain:
          schema:
            type: string

post:
  tags:
    - records
  summary: Triggers metadata parsing for a record and returns the updated record info
  description: |
    Parses file metadata (EXIF, video streams, etc.) for the given record and stores the
    results. Returns the same response as `GET /records/{record_id}/info` after the parse.
  parameters:
    - $ref: '../../parameters/record_id.yaml'
  responses:
    200:
      description: Record info after metadata scan
      content:
        application/json:
          schema:
            $ref: '../../schemas/RecordInfo.yaml'
    400:
      description: Record not found or metadata parse failed
    500:
      description: Internal server error

post:
  tags:
    - records
  summary: Parses and stores a record's metadata
  description: |
    Parses file metadata (EXIF, video streams, and so on) and stores it, then
    returns the same body as `GET /records/{record_id}/info`.
  parameters:
    - $ref: '../../parameters/record_id.yaml'
  responses:
    200:
      description: Record info after the scan
      content:
        application/json:
          schema:
            $ref: '../../schemas/RecordInfo.yaml'
    400:
      description: Record not found, or the parse failed
    500:
      description: Internal server error

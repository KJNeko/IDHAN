post:
  tags:
    - records
  summary: Creates records from SHA-256 hashes
  description: |
    Creates one record per hash. This registers hashes only; to upload file data
    use `POST /file/import`.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - sha256
          properties:
            sha256:
              oneOf:
                - $ref: '../../schemas/SHA256.yaml'
                - type: array
                  items:
                    $ref: '../../schemas/SHA256.yaml'
        examples:
          single:
            summary: Single hash
            value:
              sha256: '869cc28dd25de48206a5ab275b14aef421691897269bd82483c1671ba5644d29'
          array:
            summary: Array of hashes
            value:
              sha256: [ '869cc28dd25de48206a5ab275b14aef421691897269bd82483c1671ba5644d29', '869cc28dd25de48206a5ab275b14aef421691897269bd82483c1671ba5644d29' ]
  responses:
    200:
      description: Records created. An array in, an array out.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                properties:
                  record_id:
                    type: integer
                example:
                  record_id: 1234
              - type: array
                items:
                  type: integer
                example: [ 1234, 5678 ]
          examples:
            single:
              summary: Single hash
              value:
                record_id: 1234
            array:
              summary: Array of hashes
              value: [ 1234, 5678 ]
    400:
      description: Invalid content type, SHA-256, or JSON
    500:
      description: Internal server error

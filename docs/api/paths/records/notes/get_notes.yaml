get:
  tags:
    - records
    - notes
  summary: Returns a record's notes
  parameters:
    - $ref: '../../../parameters/record_id.yaml'
  responses:
    '200':
      description: The record's notes
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required: [ note_id, text ]
              properties:
                note_id:
                  type: integer
                  format: int32
                text:
                  type: string
          examples:
            with_notes:
              summary: Record with two notes
              value:
                - note_id: 1
                  text: "This image is from episode 3."
                - note_id: 2
                  text: "Original source unknown."
            no_notes:
              summary: Record with no notes
              value: [ ]
    '400':
      description: Invalid `record_id`
    '500':
      description: Internal server error

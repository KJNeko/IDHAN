post:
  tags:
    - records
    - notes
  summary: Adds a note to a record
  description: |
    Notes are deduplicated by text, so an existing note with identical text is
    reused rather than created again. Returns the record's full note list.
  parameters:
    - $ref: '../../../parameters/record_id.yaml'
  requestBody:
    required: true
    content:
      text/plain:
        schema:
          type: string
        examples:
          simple:
            summary: A short note
            value: "This image is from episode 3."
  responses:
    '200':
      description: The record's notes after insertion
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required: [ note_id, text ]
              properties:
                note_id:
                  type: integer
                  format: int32
                text:
                  type: string
          examples:
            after_insert:
              summary: Notes after adding one
              value:
                - note_id: 1
                  text: "This image is from episode 3."
    '400':
      description: Content-Type was not `text/plain`, or `record_id` is invalid
    '500':
      description: Internal server error

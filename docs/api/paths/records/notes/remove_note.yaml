delete:
  tags:
    - records
    - notes
  summary: Removes a note from a record
  description: |
    Unlinks the note from the record. Returns the record's remaining notes.
  parameters:
    - $ref: '../../../parameters/record_id.yaml'
    - $ref: '../../../parameters/note_id.yaml'
  responses:
    '200':
      description: The record's notes after removal
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required: [ note_id, text ]
              properties:
                note_id:
                  type: integer
                  format: int32
                text:
                  type: string
          examples:
            after_remove:
              summary: Notes after removing one
              value:
                - note_id: 2
                  text: "Original source unknown."
            empty:
              summary: No notes remaining
              value: [ ]
    '400':
      description: Invalid `record_id` or `note_id`
    '500':
      description: Internal server error

get:
  tags:
    - records
  summary: Returns the record's file
  description: |
    `Content-Type` is the record's stored MIME type, or `application/octet-stream`
    if none has been recorded yet.

    Range requests use `bytes=start-end`. A `bytes=0-` range is served as a full file.

    Also registered at `/records/{record_id}`.
  parameters:
    - $ref: '../../parameters/record_id.yaml'
    - in: query
      name: download
      required: false
      schema:
        type: boolean
        default: false
      description: >
        Serve with `Content-Disposition: attachment` instead of inline.
    - in: header
      name: Range
      required: false
      schema:
        type: string
        example: 'bytes=0-1023'
      description: Only `bytes=start-end` is supported. Omit for the full file.
  responses:
    '200':
      description: Full file content
      headers:
        Content-Type:
          description: Stored MIME type, or `application/octet-stream` if unknown.
          schema:
            type: string
        Cache-Control:
          description: Roughly one year.
          schema:
            type: string
      content:
        '*/*':
          schema:
            type: string
            format: binary
    '206':
      description: Partial file content
      headers:
        Content-Range:
          description: Bytes returned, against the total file size.
          schema:
            type: string
            example: 'bytes 0-1023/204800'
        Accept-Ranges:
          description: Always `bytes`.
          schema:
            type: string
      content:
        '*/*':
          schema:
            type: string
            format: binary
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

head:
  tags:
    - records
  summary: Returns the file's headers without a body
  description: |
    Same as GET, minus the body. Always sets `Accept-Ranges`, `Content-Length`,
    and `Content-Type`.
  parameters:
    - $ref: '../../parameters/record_id.yaml'
  responses:
    '200':
      description: File headers, no body
      headers:
        Accept-Ranges:
          description: Always `bytes`.
          schema:
            type: string
        Content-Length:
          description: File size in bytes.
          schema:
            type: integer
        Content-Type:
          description: Stored MIME type, or `application/octet-stream` if unknown.
          schema:
            type: string
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

get:
  tags:
    - tags
    - records
  summary: Returns a record's raw tags
  description: |
    Mappings applied directly to the record, grouped by tag domain, with no
    relationship resolution. For resolved tags use
    `/records/{record_id}/tags/active`.
  parameters:
    - name: record_id
      in: path
      required: true
      schema:
        $ref: '../../../schemas/RecordID.yaml'
  responses:
    200:
      description: Raw tag IDs grouped by domain
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - tag_domain_id
                - tag_ids
              properties:
                tag_domain_id:
                  $ref: '../../../schemas/TagDomainID.yaml'
                tag_ids:
                  type: array
                  items:
                    $ref: '../../../schemas/TagID.yaml'
          examples:
            raw_tags:
              summary: Raw tags grouped by domain
              value:
                - tag_domain_id: 1
                  tag_ids: [ 10, 20, 30 ]

post:
  tags:
    - tags
    - records
  summary: Adds tags to multiple records
  description: |
    Bulk operation to add tags or tag sets to multiple records. For single record operations, use /records/{record_id}/tags/add.
    If neither `tags` nor `sets` is provided, the request succeeds with 200 but no changes are made.
  parameters:
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: '../../../schemas/TagDomainID.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - records
          properties:
            records:
              type: array
              items:
                $ref: '../../../schemas/RecordID.yaml'
              minItems: 1
            tags:
              type: array
              items:
                $ref: '../../../schemas/TagInput.yaml'
              description: Tags to add to all specified records
            sets:
              type: array
              items:
                type: array
                items:
                  $ref: '../../../schemas/TagInput.yaml'
              description: Individual tag sets for each record (must match records array length)
        examples:
          bulk_tags:
            summary: Add same tags to multiple records
            value:
              records: [ 1, 2, 3 ]
              tags:
                - "character:toujou koneko"
                - "catgirl"
                - "series:highschool dxd"
          individual_sets:
            summary: Add different tag sets to each record
            value:
              records: [ 1, 2, 3 ]
              sets:
                - [ { namespace: "character", subtag: "toujou koneko" } ]
                - [ { namespace: "character", subtag: "toujou koneko" }, { namespace: 3, subtag: 5 } ]
                - [ { namespace: 9, subtag: 2 } ]
  responses:
    200:
      description: Tags added successfully to all records
    400:
      description: Invalid request data (malformed JSON, invalid records array, mismatched sets/records count, unknown tag_domain_id)
    500:
      description: Internal server error (database failure while inserting tag mappings)
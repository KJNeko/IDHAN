post:
  tags:
    - tags
    - records
  summary: Adds tags to multiple records
  description: |
    Use `/records/{record_id}/tags/add` for a single record.
    With neither `tags` nor `sets` given, the request is a 200 no-op.
  parameters:
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: '../../../schemas/TagDomainID.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - records
          properties:
            records:
              type: array
              items:
                $ref: '../../../schemas/RecordID.yaml'
              minItems: 1
            tags:
              type: array
              items:
                $ref: '../../../schemas/TagInput.yaml'
              description: Added to every record in `records`.
            sets:
              type: array
              items:
                type: array
                items:
                  $ref: '../../../schemas/TagInput.yaml'
              description: One set per record, in order. Must match `records` in length.
        examples:
          bulk_tags:
            summary: Add same tags to multiple records
            value:
              records: [ 1, 2, 3 ]
              tags:
                - "character:toujou koneko"
                - "catgirl"
                - "series:highschool dxd"
          individual_sets:
            summary: Add different tag sets to each record
            value:
              records: [ 1, 2, 3 ]
              sets:
                - [ { namespace: "character", subtag: "toujou koneko" } ]
                - [ { namespace: "character", subtag: "toujou koneko" }, { namespace: 3, subtag: 5 } ]
                - [ { namespace: 9, subtag: 2 } ]
  responses:
    200:
      description: Tags added
    400:
      description: Malformed body, bad `records`, `sets` length mismatch, or unknown `tag_domain_id`
    500:
      description: Internal server error

get:
  tags:
    - tags
    - records
  summary: Returns a record's resolved tags
  description: |
    Tags after alias resolution, parent inheritance, and sibling resolution.
    For the raw stored tags use `/records/{record_id}/tags`.
  parameters:
    - name: record_id
      in: path
      required: true
      schema:
        $ref: '../../../schemas/RecordID.yaml'
  responses:
    200:
      description: Resolved tag IDs grouped by domain
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - tag_domain_id
                - tag_ids
              properties:
                tag_domain_id:
                  $ref: '../../../schemas/TagDomainID.yaml'
                tag_ids:
                  type: array
                  items:
                    $ref: '../../../schemas/TagID.yaml'
          examples:
            active_tags:
              summary: Resolved tags grouped by domain
              value:
                - tag_domain_id: 1
                  tag_ids: [ 10, 20, 30 ]

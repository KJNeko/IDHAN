post:
  tags:
    - tags
    - records
  summary: Adds tags to a record
  description: >
    Tag IDs are the fast path. String and object inputs have to be resolved (and
    created if missing) on every request, so for bulk work create the tags with
    `POST /tags/create` first and pass the IDs.
  parameters:
    - name: record_id
      in: path
      required: true
      schema:
        $ref: '../../../schemas/RecordID.yaml'
    - name: tag_domain_id
      in: query
      required: true
      schema:
        $ref: '../../../schemas/TagDomainID.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../../schemas/TagInput.yaml'
        examples:
          IDs:
            summary: An array of multiple tag ids
            value:
              - 1
              - 2
              - 3
          Strings:
            summary: An array of strings
            value:
              - "character:toujou koneko"
              - "catgirl"
              - "series:highschool dxd"
          Tag objects:
            summary: An array of tag objects
            value:
              - namespace: "character"
                subtag: "toujou koneko"
              - namespace: 1
                subtag: 1
  responses:
    200:
      description: Tags added
    400:
      description: Invalid tag ID, `tag_domain_id`, or body
    500:
      description: Internal server error

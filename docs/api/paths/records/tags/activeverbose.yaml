get:
  tags:
    - tags
    - records
  summary: Returns resolved tags with their provenance
  description: |
    Same as `/records/{record_id}/tags/active`, plus where each tag came from.
  parameters:
    - name: record_id
      in: path
      required: true
      schema:
        $ref: '../../../schemas/RecordID.yaml'
  responses:
    200:
      description: Resolved tags with provenance
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - tag_id
                - tag_domain_id
                - explicit
                - aliased_from
                - inherited_from
              properties:
                tag_id:
                  $ref: '../../../schemas/TagID.yaml'
                tag_domain_id:
                  $ref: '../../../schemas/TagDomainID.yaml'
                explicit:
                  type: boolean
                  description: Stored directly on the record.
                aliased_from:
                  type: array
                  items:
                    $ref: '../../../schemas/TagID.yaml'
                  description: Tags this one was resolved from.
                inherited_from:
                  type: array
                  items:
                    $ref: '../../../schemas/TagID.yaml'
                  description: Tags that pulled this one in as a parent.
          examples:
            verbose:
              summary: Verbose resolved tags
              value:
                - tag_id: 10
                  tag_domain_id: 1
                  explicit: true
                  aliased_from: [ ]
                  inherited_from: [ ]
                - tag_id: 30
                  tag_domain_id: 1
                  explicit: false
                  aliased_from: [ 25 ]
                  inherited_from: [ ]

get:
  tags:
    - downloader
  summary: Lists download sessions
  responses:
    '200':
      description: Lists download sessions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/DownloadSession.yaml
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
  description: Ordered by last_used_at and ID descending. Timestamps are Unix seconds.
post:
  tags:
    - downloader
  summary: Creates a download session
  responses:
    '201':
      description: Creates a download session
      content:
        application/json:
          schema:
            $ref: ../schemas/DownloadSession.yaml
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '409':
      description: The request conflicts with existing state.
      content:
        text/plain:
          schema:
            type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - name

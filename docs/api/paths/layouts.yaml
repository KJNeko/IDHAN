get:
  tags:
    - layouts
  summary: Lists saved layouts
  responses:
    '200':
      description: Lists saved layouts
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - id
                - name
                - schema
                - created_at
                - updated_at
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                schema:
                  type: integer
                created_at:
                  type: integer
                  format: int64
                  description: Unix epoch seconds in UTC.
                updated_at:
                  type: integer
                  format: int64
                  description: Unix epoch seconds in UTC.
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
post:
  tags:
    - layouts
  summary: Creates a layout
  responses:
    '201':
      description: Creates a layout
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
            required:
              - id
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
    '409':
      description: The request conflicts with existing state.
      content:
        text/plain:
          schema:
            type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/LayoutDocument.yaml
  description: Stores the complete document. IDs must be UUID-shaped; names are unique ignoring case.
    No application-level request body size limit is imposed; processing remains subject to available resources.

get:
  tags:
    - layouts
  summary: Lists available WebUI plugin manifests
  responses:
    '200':
      description: Lists available WebUI plugin manifests
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                version:
                  type: string
                hostApi:
                  type: string
                description:
                  type: string
                panels:
                  type: array
                  items:
                    type: object
                dir:
                  type: string
                entry:
                  type: string
              required:
                - id
                - name
                - version
                - hostApi
                - dir
                - entry
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
  parameters:
    - name: rescan
      in: query
      required: false
      schema:
        type: boolean
        default: false

get:
  tags:
    - maintenance
  summary: Returns recent server log text
  responses:
    '200':
      description: Returns recent server log text
      content:
        text/plain:
          schema:
            type: string
    '400':
      description: Request rejected; the body is a plain-text error message.
      content:
        text/plain:
          schema:
            type: string
    '401':
      description: The supplied API key is not recognized.
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Internal server error.
      content:
        text/plain:
          schema:
            type: string
  parameters:
    - name: level
      in: query
      required: false
      schema:
        type: string
        default: info
    - name: since
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Include entries at or after this Unix timestamp in seconds.

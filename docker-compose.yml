services:
  idhan-postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: idhan-postgres
    environment:
      POSTGRES_USER: idhan
      POSTGRES_PASSWORD: idhan
      POSTGRES_DB: idhan-db
    volumes:
      - idhan_pg18:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U idhan -d idhan-db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # If you experienced with testing yourself, Configure using the tuning guide https://postgresqlco.nf/tuning-guide
    # Baseline perf tuning for a typical home server/desktop (16GB RAM, 4 cores, SSD/NVMe) — stock
    # postgres:18 defaults are sized for ~1GB-RAM machines. Scale *_buffers/*_mem roughly with RAM.
    command:
      - postgres
      - -c
      - shared_buffers=4GB # ~25% of RAM
      - -c
      - effective_cache_size=12GB # ~75% of RAM
      - -c
      - work_mem=64MB # per sort/hash; too low and queries spill to disk temp files
      - -c
      - maintenance_work_mem=1GB
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=128MB # Minimum reserved disk usage space for WAL
      - -c
      - random_page_cost=1.0 # assumes SSD/NVMe; set back to 4 for spinning disks
      - -c
      - max_worker_processes=6 # Set to 75% to 90% of available cores for best performance.
      - -c
      - max_parallel_workers_per_gather=2 # (Default) Raise only if you have actually observed a requirement for it
      - -c
      - max_parallel_workers=6 # Dependent on above values

  idhan-server:
    image: git.futuregadgetlabs.net/kj16609/idhan:latest
    container_name: idhan-server
    environment:
      IDHAN_DATABASE_HOST: idhan-postgres
      IDHAN_DATABASE_USER: idhan
      IDHAN_DATABASE_PASSWORD: idhan
      IDHAN_DATABASE_DATABASE: idhan-db
      # Route thumbnails into the persistent volume.
      # File clusters must also be registered under /media/clusters/ via the API.
      IDHAN_THUMBNAILS_PATH: /media/thumbnails
    ports:
      - "16609:16609"
    volumes:
      - idhan_media:/media
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:16609/health" ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      idhan-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  idhan_pg18:
  idhan_media:

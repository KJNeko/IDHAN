[database]
#host = "localhost"
#port = 5432
#user = "idhan"
#password = "your_password_here"
#database = "idhan-db"


[server]
#host = "0.0.0.0"
#port = 16609
#threads = 4
#use_stdout = true
#tmp_path = /tmp/idhan

[logging]
# Loggin level: trace, debug, info, warn, error, critical
level = "info"
# Logging output location
path = "./log"

[thumbnails]
# Where generated thumbnails are cached on disk
#path = "./thumbnails"
# Square thumbnail edge lengths (px) the server is allowed to write to the on-disk cache. Any other
# requested size is still generated and served, just never cached (so arbitrary sizes can't grow the
# cache without bound). Edited live — no restart needed.
#cacheable_sizes = [128, 256, 512]
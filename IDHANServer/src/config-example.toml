[database]
#host = "localhost"
#port = 5432
#user = "idhan"
#password = "your_password_here"
#database = "idhan-db"


[server]
#host = "0.0.0.0"
#port = 16609
#threads = 4
#use_stdout = true
#tmp_path = /tmp/idhan

[logging]
# Loggin level: trace, debug, info, warn, error, critical
level = "info"
# Logging output location
path = "./log"

[thumbnails]
# Where generated thumbnails are cached on disk
#path = "./thumbnails"
# Whether the on-disk cache is used at all. Off bypasses it in both directions -- nothing is read
# from it and nothing is written to it, so every request regenerates through the thumbnailer. Meant
# for working on a thumbnailer module, where serving yesterday's cached output hides your changes.
# Read live, so it can be flipped without restarting.
#cache = true
# Empty the cache directory during startup. Applies at startup only; nothing purges the cache again
# while the server runs. Safe at any time -- the cache is plain files with no database state behind
# it, so a purged thumbnail is simply regenerated on the next request.
#purge_on_boot = false
# Square thumbnail edge lengths (px) the server is allowed to write to the on-disk cache. Any other
# requested size is still generated and served, just never cached (so arbitrary sizes can't grow the
# cache without bound). Edited live — no restart needed.
#cacheable_sizes = [128, 256, 512]

[modules]
# Media modules (libvips, FFmpeg, libarchive, PSD) never run inside the server. Each module library
# is hosted by its own IDHANModuleRunner process, so a module that leaks, corrupts its heap or
# crashes outright takes only that process with it.
#
# A library declares whether it wants a long-lived worker (libvips, whose VIPS_INIT is far too
# expensive to pay per call) or a fresh process per call (total leak immunity). That choice comes
# from the modules themselves and is not configurable here.

# Path to IDHANModuleRunner. Found automatically next to the server binary, then on the install
# path; set this only if it lives somewhere else.
#runner_path = "/usr/bin/IDHANModuleRunner"

# Worker threads inside each worker process. More than one is required, not merely faster: an
# archive thumbnailer asks the host to thumbnail each member, and that nested call comes back into
# the same process, so it has to be served on a different thread than the one waiting for it.
#pool_threads = 4

# A persistent worker is retired once it exceeds this resident size, at its next moment with no call
# in flight. This is what bounds a leak rather than merely isolating it.
#
# A module may declare a larger footprint of its own, and the larger of the two wins for that
# library's worker. The embedding module does: it holds ONNX sessions resident whose size follows the
# model on disk, which no number written here could anticipate. So this is a floor rather than a cap
# -- raising it loosens every library's bound, but lowering it will not tighten one that a module has
# declared for itself.
#rss_limit_mb = 2048

# A persistent worker with nothing to do for this long is retired.
#idle_timeout_sec = 300

# Workers report in on this interval, carrying their resident size. Missing them for longer than the
# grace period gets the worker killed.
#
# This is the only thing that will kill a call, and it asks one question: does the process still
# exist? A worker answers heartbeats from its IO loop, which never runs module code, so beats keep
# arriving however deep its backlog is. There is deliberately no per-call deadline: a call queued
# behind a hundred others is indistinguishable from a wedged one, and the old deadline took down the
# whole worker -- and every other call in flight on it -- to kill a single slow request. A waiting
# call costs a suspended coroutine and no thread, so waiting is cheap.
#heartbeat_interval_ms = 1000
#liveness_grace_ms = 5000

# How deeply module calls may nest (an archive inside an archive inside an archive). Enforced by the
# server, which is the only party that sees the whole chain: the recursion crosses process
# boundaries, so no counter inside a single worker can bound it.
#max_call_depth = 4

# How long to wait for a library to describe what it exports at startup. A library that hangs here
# is skipped with a warning; it does not stop the server from starting.
#describe_timeout_sec = 10

[embeddings]
# Directory scanned for image embedding models. Each subdirectory holding both a model.onnx and a
# model.json is registered as one model, named by its model.json; anything else is ignored with a
# warning naming what was wrong. A directory that does not exist is not an error -- the server logs
# that no embedding model is available and every other module carries on.
#
# Defaults to a "models" directory beside IDHANModuleRunner, which is convenient for a build tree
# and rarely what a deployment wants. Set it explicitly anywhere the runner is installed to a bin
# directory you do not control.
#
# The models themselves are exported offline; see tools/embedding-export/export_siglip2.py. Nothing
# in the server converts a checkpoint, so a directory of PyTorch weights registers nothing.
#model_path = "/usr/share/idhan/models"

[plugins]
# Directory scanned for WebUI plugin bundles — each subdirectory with a manifest.json is one plugin.
# Defaults to "<static>/plugins" so the static file server serves the bundles at /plugins/... with no
# extra configuration. An override must still live under the static root to be reachable by the browser.
#path = "./static/plugins"
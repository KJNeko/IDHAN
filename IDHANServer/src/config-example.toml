[database]
#host = "localhost"
#port = 5432
#user = "idhan"
#password = "idhan"
#database = "idhan-db"
# Application schema; created automatically.
# Missing extensions are created in extension_schema when permitted; otherwise ask the database administrator.
# Startup rejects public.idhan_info; migrate public installations manually first.
#schema = "idhan"
# Extension namespace; created when missing and permitted. Existing extensions are not moved.
#extension_schema = "public"

[server]
#port = 16609
# HTTP event loop threads. Zero means every thread this machine has.
#io_threads = 4
#job_threads = 4
#use_stdout = true
# Staging directory, Keep this on fast storage or in RAM.
#temp_path = "/tmp/idhan"

[host]
# Set either to "" to disable that listener. Both use [server] port.
#ipv4_listen = "127.0.0.1"
#ipv6_listen = "::1"
#use_tls = false
# Required when use_tls is true unless self_sign_tls is enabled.
#server_cert_path = "./server.crt"
#server_key_path = "./server.key"
# Generate a persistent localhost certificate when both paths are absent. Browsers
# will still require you to trust this certificate before treating it as secure.
#self_sign_tls = true

[logging]
# Level: trace, debug, info, warn, error, or critical.
level = "info"
# Output directory.
path = "./log"
# Entries held in memory for the /log endpoint. Zero disables the endpoint.
#buffer_size = 1000000
# Logs a warning when a request outruns its performance threshold.
#enable_perf_warnings = false

[thumbnails]
# Generated thumbnail cache directory.
#path = "./thumbnails"
# Enables the on-disk cache. Read once at startup.
#cache = true
# Purges cached thumbnails at startup only; missing thumbnails regenerate on request.
#purge_on_boot = false
# Cacheable square edge lengths in pixels; other sizes are served but not cached. Read once at startup.
#cacheable_sizes = [128, 256, 512]

[modules]
# IDHANModuleRunner path; auto-discovered beside the server, then on the install path.
#runner_path = "/usr/bin/IDHANModuleRunner"

# Unlike the server, module workers are rationed: left unset, pool_threads * render_threads comes to
# a quarter of this machine's threads. Setting either one explicitly overrides that. Zero on either
# means every thread this machine has.

# Calls one worker process runs at once; nested module calls require more than one.
pool_threads = 4

# Number of threads each runner is allowed (Total count is pool_threads * render_threads)
# If a module is marked as singlethreaded, it will instead turn these into pools, So you'll have pool_threads * render_thread pools instead.
render_threads = 2

# Worker RSS limit in MiB, checked when idle. This is a floor; larger module limits take precedence.
#rss_limit_mb = 2048

# Idle time in seconds before a persistent worker is retired.
#idle_timeout_sec = 300

# Heartbeat interval and missed-heartbeat grace period in milliseconds; grace controls liveness.
#heartbeat_interval_ms = 1000
#liveness_grace_ms = 5000

# Maximum nested module-call depth, counted in calls.
#max_call_depth = 4

# Seconds to wait at startup for a library description; timed-out libraries are skipped.
#describe_timeout_sec = 10

# Per-library overrides. The table name is the module file stem, and any of pool_threads,
# render_threads, rss_limit_mb, idle_timeout_sec, heartbeat_interval_ms and liveness_grace_ms
# may be set. Anything left out falls back to the [modules] value above.
# Libraries: IDHANVips, IDHANFFmpeg, IDHANPsd, IDHANArchive, IDHANUgoira, IDHANEmbedding.
#[modules.IDHANVips]
#pool_threads = 8
#render_threads = 2

#[modules.IDHANFFmpeg]
#pool_threads = 2
#render_threads = 8

[embeddings]
# Model directory; each model subdirectory needs model.onnx and model.json.
# Defaults beside IDHANModuleRunner; set this to override that location.
#model_path = "/usr/share/idhan/models"

[plugins]
# WebUI plugin directory; each plugin needs manifest.json. Overrides must remain under the static root.
#path = "./static/plugins"

[cluster]
# Acknowledge missing writable cluster marker/root recovery; reset to false before recovery.
# Check that the intended storage is mounted. Existing conflicting markers are never replaced.
# Requires a writable TOML file and directory; true environment/CLI overrides are rejected.
#recreate_missing_markers = false
# Concurrent files per cluster scan; overridable per request by "concurrency" and clamped to 1..64.
scan_concurrency = 12

[downloader]
# Download known direct URLs again instead of reusing their stored file.
#force_download = false
# Directory containing precompiled JavaScript parser bundles. Compile TypeScript externally.
# Every parser, and any module that only exports URL class policy, lives here.
# Relative paths resolve against the working directory; native builds stage ./downloaders/parsers.
#parser_directory = "./downloaders/parsers"
# Reload changed JavaScript bundles and configured URL-class JSON automatically.
#watch_scripts = true
#script_watch_interval_ms = 500
#script_watch_debounce_ms = 250
# Typed overrides keyed by parser ID; also IDHAN_DOWNLOADER_OPTIONS_JSON.
#options_json = '{"gelbooru":{"pageLimit":10,"followSource":false,"tagBlacklist":[]}}'
# Optional extra URL-class JSON file or directory, e.g. to add hosts to a parser's classes.
# Parsers already supply their own classes, so this is unset by default.
#url_classes = ""
# URL classes without requestRate are limited to one request every five seconds.
# Set requestRate to false for a class or host with unlimited request starts.
# Wire version offered to sites: "1.1", "2", or "3". HTTP/3 is preferred and falls back when unavailable.
#http_version = "3"

# Threads driving the HTTP lanes. 0 takes max(2, hardware threads / 2).
#io_threads = 0
# How long a lane keeps its connections open after the last request was queued for its host.
# Keeping them open is what lets HTTP/2 and HTTP/3 multiplex the next batch over one connection.
#lane_keep_alive_seconds = 30
# Cooldown for parser errors and statuses listed in lane.backoffStatuses. Failures already in flight
# share an open pause. HTTP 429 instead honors Retry-After, or doubles its fallback delay from 1s
# to 60s; another 429 after the maximum fallback pause disables the lane until explicitly enabled.
# Ten consecutive HTTP 2xx responses recover one request per window, up to the configured rate.
#lane_error_backoff_seconds = 30
# Occupied slots per lane, including downloads awaiting bounded import finalization.
# Request-rate limits cap starts independently; URL class/host concurrency overrides these.
#lane_concurrency = 1
# In-flight HTTP requests per download session before the session stops starting new scripts.
#session_inflight_requests = 64
# Memory budget per parser runtime. All sessions share each parser's instances;
# increasing parser_instances can multiply memory use.
#worker_memory_limit = 268435456
# Stack ceiling per parser runtime.
#worker_stack_limit = 1048576
# Maximum QuickJS instances per parser across all sessions, allocated lazily.
# Each instance owns a dedicated thread; there is no fixed global thread pool.
#parser_instances = 1
# Worker count in each of the import preparation, disk writer, and file finalization pools.
#import_threads = 4
# Bounds one uninterrupted run of JavaScript, excluding synchronous host callbacks such as
# database operations. Time awaiting an HTTP request is also excluded.
#script_burst_timeout_ms = 5000
# Ceiling on a response body idhan.request materialises in memory. Imports stream and ignore it.
#max_response_bytes = 33554432
# Sent with every downloader request. Empty uses the built-in "Mozilla/5.0 (compatible; IDHAN Client)",
# which mirrors the form Hydrus ships because that is what boorus are already configured to accept.
#user_agent = ""
# Existing tag domain used for parser-supplied tags.
#tag_domain = "default"
# Secrets exposed through session.secrets are JSON objects keyed by configured root domain.
# POST an object of domain objects to /downloader/secrets; GET returns the saved objects.
# The configured root domain and its subdomains share one object; unrelated domains do not.
#   {"gelbooru.com": {"apiKey": "...", "userID": "..."}}

[parser.cbz]
# Falls back to the .cbz extension when the archive's contents are inconclusive.
#guess_with_extension = true

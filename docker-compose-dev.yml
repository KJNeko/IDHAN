services:
  idhan-postgres:
    image: postgres:18
    container_name: idhan-postgres
    environment:
      POSTGRES_USER: idhan
      POSTGRES_PASSWORD: idhan
      POSTGRES_DB: idhan-db
    volumes:
      - /db:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U idhan -d idhan-db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  idhan-server:
    build:
      context: .
      args:
        IDHAN_DISABLE_API_AUTH: "ON"
        CMAKE_BUILD_TYPE: "Debug"
        # Git metadata for /version. The container has no .git, so the host supplies it. Populate with:
        #   FGL_GIT_TAG=$(git describe --tags --always) \
        #   FGL_GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD) \
        #   FGL_GIT_COMMIT=$(git rev-parse --short HEAD) \
        #   docker compose -f docker-compose-dev.yml up --build
        # Unset, it falls back to unknown/0.0.0 (same as before).
        FGL_GIT_BRANCH: ${FGL_GIT_BRANCH:-unknown}
        FGL_GIT_COMMIT: ${FGL_GIT_COMMIT:-unknown}
        FGL_GIT_TAG: ${FGL_GIT_TAG:-v0.0.0}
    container_name: idhan-server
    environment:
      IDHAN_LOGGING_LEVEL: debug
      IDHAN_DATABASE_HOST: idhan-postgres
      IDHAN_DATABASE_USER: idhan
      IDHAN_DATABASE_PASSWORD: idhan
      IDHAN_DATABASE_DATABASE: idhan-db
      IDHAN_THUMBNAILS_PATH: /media/thumbnails
    ports:
      - "16609:16609"
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:16609/health" ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      idhan-postgres:
        condition: service_healthy
    volumes:
      - /media:/media
    restart: unless-stopped